<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="board.pageTitle">共享画板 · XRST.Uk</title>
  <meta name="description" content="一块所有人共用的画板：文字画板写下想法，256×256 像素画板一起涂鸦，注册即可参与。" />
  <link rel="stylesheet" href="../css/style.css?v=24" />
</head>
<body>

  <header class="nav">
    <div class="nav-inner">
      <a class="logo" href="/">XRST<span class="logo-dot">.Uk</span></a>
      <nav class="nav-links">
        <a href="/#about" data-i18n="nav.about">关于</a>
        <a href="/#works" data-i18n="nav.works">好玩的</a>
        <a href="/market/" data-i18n="nav.market">二手交易</a>
        <a href="/#rewards" data-i18n="nav.rewards">签到</a>
        <a href="/chat/" data-i18n="nav.chat">聊天室</a>
        <a href="/#contact" data-i18n="nav.contact">联系</a>
      </nav>
      <div class="nav-auth" id="navAuth"></div>
    </div>
  </header>

  <main class="wb-main">
    <p class="wb-eyebrow" data-i18n="board.eyebrow">一些小东西 · 共享实验</p>
    <h1 class="wb-title" data-i18n="board.title">共享画板</h1>
    <p class="wb-sub" data-i18n="board.sub">两块所有人共用的画布——文字留言，或者在像素画布上一起涂鸦。</p>

    <!-- 模式切换 -->
    <div class="board-tabs" role="tablist">
      <button class="board-tab active" id="tabBtnText" type="button" role="tab" data-i18n="board.tabText">📝 文字画板</button>
      <button class="board-tab" id="tabBtnPixel" type="button" role="tab" data-i18n="board.tabPixel">🎨 像素画板</button>
    </div>

    <!-- ============ 文字画板 ============ -->
    <section id="panelText">
      <div class="announce-board">
        <div class="announce-head">
          <span class="announce-icon">📝</span>
          <h2 class="announce-title" data-i18n="board.contentTitle">画板内容</h2>
          <span class="announce-time" id="boardTime"></span>
          <button class="btn btn-ghost btn-small announce-edit-btn" id="boardEditBtn" type="button" hidden data-i18n="board.editBtn">编辑画板</button>
        </div>
        <div class="announce-body" id="boardBody">
          <p class="announce-loading" data-i18n="board.loading">加载中…</p>
        </div>

        <!-- 编辑面板（登录用户可见） -->
        <div class="announce-editor" id="boardEditor" hidden>
          <textarea
            id="boardInput"
            class="pf-textarea"
            maxlength="3500"
            rows="10"
            data-i18n="board.textareaPlaceholder" data-i18n-attr="placeholder"
            placeholder="在这里写点什么吧——涂鸦、留言、接龙、标语……（所有人可见，最多 3500 字）"
          ></textarea>
          <div class="announce-editor-bar">
            <span class="pf-counter"><b id="boardCount">0</b> / 3500</span>
            <button class="btn btn-solid btn-small" id="boardSaveBtn" type="button" data-i18n="board.saveBoardBtn">保存画板</button>
            <button class="btn btn-ghost btn-small" id="boardCancelBtn" type="button" data-i18n="board.cancel">取消</button>
          </div>
        </div>
      </div>
      <p class="wb-note" style="margin-top:14px;" data-i18n="board.note">任何人编辑后都会覆盖整块画板 —— 请手下留情，别把别人的创作擦掉了 awa</p>
    </section>

    <!-- ============ 像素画板 ============ -->
    <section id="panelPixel" hidden>
      <div class="pixel-board">
        <div class="pixel-toolbar">
          <div class="pixel-palette" id="pixelPalette"><!-- 20 色 + 橡皮由 JS 生成 --></div>
          <div class="pixel-tools-right">
            <div class="pixel-zoom">
              <button type="button" id="zoomOut" data-i18n="board.zoomOut" data-i18n-attr="title" title="缩小">−</button>
              <span id="zoomLabel">2×</span>
              <button type="button" id="zoomIn" data-i18n="board.zoomIn" data-i18n-attr="title" title="放大">＋</button>
              <button type="button" id="zoomFit" data-i18n="board.zoomFit" data-i18n-attr="title" title="适应屏幕">⛶</button>
            </div>
            <button type="button" class="pixel-mode-btn" id="panModeBtn" data-i18n="board.brush">✏️ 画笔</button>
            <span class="pixel-status" id="pixelStatus" data-i18n="board.loading">加载中…</span>
          </div>
        </div>

        <div class="pixel-viewport" id="pixelViewport">
          <div class="pixel-scroll" id="pixelScroll">
            <div class="pixel-inner" id="pixelInner">
              <canvas id="pixelCanvas" width="256" height="256" data-i18n="board.pixelCanvasAria" data-i18n-attr="aria-label" aria-label="像素画板"></canvas>
            </div>
          </div>
          <div class="pixel-mask" id="pixelMask" hidden>
            <div class="pixel-mask-inner">
              <p data-i18n="board.pixelLoginHint">登录后就能一起画 🎨</p>
              <button class="btn btn-solid btn-small" id="pixelLoginBtn" type="button" data-i18n="board.pixelLoginBtn">去登录</button>
            </div>
          </div>
        </div>

        <p class="wb-note" style="margin-top:10px;" data-i18n="board.pixelNote">
          256×256 的公共画布，选个颜色直接画，白色方块是橡皮擦。鼠标滚轮（或工具栏）可以放大到 8× 精细作画，放大后切「✋拖动」或按住空格移动画布。大家的画会实时叠在同一张画布上～
        </p>
      </div>
    </section>

    <div class="dc-foot wb-backfoot">
      <a class="dc-back" href="/#works" data-i18n="dc.back">← 回到好玩的</a>
    </div>
  </main>

  <!-- 登录 / 注册弹窗 -->
  <div class="modal-mask" id="authModal" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <button class="modal-close" id="authClose" data-i18n="common.close" data-i18n-attr="aria-label" aria-label="关闭">×</button>
      <div class="modal-tabs">
        <button class="tab active" data-tab="login" data-i18n="auth.loginTab">登录</button>
        <button class="tab" data-tab="register" data-i18n="auth.registerTab">注册</button>
      </div>

      <form id="loginForm" class="modal-form" autocomplete="on">
        <label data-i18n="auth.usernameLabel">用户名 / XRSTUID
            <input type="text" name="username" required minlength="2" maxlength="20" data-i18n="auth.usernamePlaceholder" data-i18n-attr="placeholder" placeholder="用户名或 XRSTUID" />
        </label>
        <label data-i18n="auth.passwordLabel">密码
          <input type="password" name="password" required minlength="6" data-i18n="auth.passwordPlaceholder" data-i18n-attr="placeholder" placeholder="至少 6 位" />
        </label>
        <p class="form-msg" data-msg></p>
        <button type="submit" class="btn btn-solid btn-block" data-i18n="auth.loginBtn">登录</button>
      </form>

      <form id="registerForm" class="modal-form" hidden autocomplete="off">
        <label data-i18n="auth.usernameLabel">用户名
          <input type="text" name="username" required minlength="2" maxlength="20" data-i18n="auth.registerUsernamePlaceholder" data-i18n-attr="placeholder" placeholder="2-20 个字符" />
        </label>
        <label data-i18n="auth.passwordLabel">密码
          <input type="password" name="password" required minlength="6" data-i18n="auth.passwordPlaceholder" data-i18n-attr="placeholder" placeholder="至少 6 位" />
        </label>
        <label data-i18n="auth.confirmPasswordLabel">确认密码
          <input type="password" name="password2" required minlength="6" data-i18n="auth.confirmPasswordPlaceholder" data-i18n-attr="placeholder" placeholder="再输一遍" />
        </label>
        <p class="form-msg" data-msg></p>
        <button type="submit" class="btn btn-solid btn-block" data-i18n="auth.registerBtn">创建账号</button>
        <p class="form-note" data-i18n="auth.formNote">账号存储在云端，换设备也能登录。</p>
      </form>
    </div>
  </div>

  <div class="toast-box" id="toastBox"></div>

  <script src="/js/i18n.js?v=6"></script>
  <script src="../js/auth.js?v=5"></script>
  <script src="../js/main.js?v=18"></script>
  <script src="../js/board.js?v=2"></script>
  <script src="../js/pixel.js?v=5"></script>
</body>
</html>
