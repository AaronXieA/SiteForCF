<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>斗地主 & 掼蛋 & 升级</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%231b5e3a'/%3E%3Ctext x='50' y='70' font-size='46' text-anchor='middle' fill='%23e8c15a' font-family='sans-serif' font-weight='bold'%3E%E7%89%8C%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --card-w: 74px;
    --card-h: 104px;
    --red: #d93a3a;
    --black: #1f2430;
    --gold: #e8c15a;
    --felt: #17703f;
    --felt-dark: #0f5230;
    --panel: rgba(0,0,0,.32);
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    background:radial-gradient(120% 120% at 50% 20%, #1f8b55 0%, #15663c 45%, #0d4a2b 100%);
    color:#f3efe4;
    overflow:hidden;
    user-select:none;
  }
  #app{ position:relative; height:100vh; width:100vw; }
  .view{ position:absolute; inset:0; display:none; }
  .view.active{ display:block; }
  header{
    position:absolute; top:0; left:0; right:0; z-index:20;
    display:flex; align-items:center; gap:14px;
    padding:10px 18px;
    background:linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,0));
  }
  header .title{ font-size:22px; font-weight:800; letter-spacing:3px; color:#f6e7b0; text-shadow:0 2px 6px rgba(0,0,0,.4); }
  header .stats{ display:flex; gap:16px; margin-left:auto; font-size:14px; color:#e8e2d2; }
  header .stats b{ color:#ffd97a; font-size:16px; }
  .btn-ghost{
    background:rgba(255,255,255,.12); color:#f3efe4; border:1px solid rgba(255,255,255,.25);
    border-radius:8px; padding:6px 14px; font-size:14px; cursor:pointer; font-family:inherit;
  }
  .btn-ghost:hover{ background:rgba(255,255,255,.2); }
  .seat{ position:absolute; z-index:10; }
  .seat-left{ top:64px; left:18px; }
  .seat-right{ top:64px; right:18px; }
  .seat-top{ top:64px; left:50%; transform:translateX(-50%); }
  .avatar-row{ display:flex; align-items:center; gap:10px; }
  .avatar{
    width:52px; height:52px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:26px; font-weight:800; color:#2b2310;
    box-shadow:0 3px 8px rgba(0,0,0,.4); border:3px solid #e8c15a;
    background:linear-gradient(145deg,#ffe9a8,#e8c15a);
  }
  .seat-info{ display:flex; flex-direction:column; gap:3px; }
  .seat-info .name{ font-size:15px; font-weight:700; }
  .seat-info .tag{ font-size:12px; padding:1px 8px; border-radius:10px; background:var(--panel); width:max-content; }
  .tag.landlord{ background:#c9a13b; color:#2b2310; font-weight:800; }
  .tag.bid{ background:#2c7f4f; color:#eaffe9; }
  .tag.ally{ background:#2c7f4f; color:#eaffe9; }
  .tag.enemy{ background:#a13b3b; color:#ffe9e9; }
  .card-count{ display:flex; gap:2px; flex-wrap:wrap; max-width:200px; }
  .card-count .cb{
    width:22px; height:32px; border-radius:3px;
    background:linear-gradient(135deg,#2a5fa0,#1c4380);
    border:1px solid rgba(255,255,255,.35);
  }
  .seat-line{ display:flex; align-items:flex-start; gap:8px; }
  .clock{
    display:none; position:relative; width:26px; height:30px; flex:0 0 auto;
    border-radius:50%;
    background:radial-gradient(circle at 40% 35%, #fff6dd, #f7df9a);
    border:2px solid #d8a94a; box-shadow:0 2px 5px rgba(0,0,0,.45);
    align-items:center; justify-content:center; margin-top:2px;
  }
  .clock::before{
    content:""; position:absolute; top:-9px; left:50%; transform:translateX(-50%);
    width:16px; height:11px; border-radius:8px 8px 0 0;
    background:#ffd97a; border:1px solid #e0b050;
  }
  .clock::after{
    content:""; position:absolute; top:-3px; left:50%; transform:translateX(-50%);
    width:6px; height:6px; border-radius:50%; background:#f0a83a;
  }
  .clock .cd{ font-size:12px; font-weight:800; color:#7a4a12; line-height:1; margin-top:2px; }
  body.playing .seat.active .clock, body.playing .my-tag.active .clock{ display:flex; }
  .clock.low{ border-color:#d84848; animation:blink .5s infinite; }
  .clock.low::before{ background:#ff8a8a; border-color:#d84848; }
  .clock.low .cd{ color:#c82020; }
  .my-tag{ display:flex; flex-direction:column; align-items:center; gap:2px; margin-bottom:4px; }
  .mt-row{ display:flex; align-items:center; gap:8px; }
  .my-tag .name{ font-size:15px; font-weight:700; }
  .my-tag .tag{ font-size:12px; padding:1px 8px; border-radius:10px; background:var(--panel); width:max-content; }
  @keyframes blink{ 50%{ opacity:.35; } }
  .center{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    display:flex; flex-direction:column; align-items:center; gap:12px; z-index:8;
  }
  .bottom-cards{ display:flex; gap:6px; }
  .bottom-cards .card{ box-shadow:0 2px 6px rgba(0,0,0,.4); }
  .turn-hint{
    font-size:15px; font-weight:700; letter-spacing:1px;
    background:var(--panel); padding:6px 16px; border-radius:20px; text-align:center;
    min-height:32px; display:flex; align-items:center; justify-content:center;
    max-width:88vw; line-height:1.4;
  }
  .turn-hint .turn{ color:#ffd97a; }
  .mult{ font-size:13px; color:#ffe3a6; background:var(--panel); padding:3px 12px; border-radius:12px; }
  .play-zone{ min-height:110px; display:flex; align-items:center; justify-content:center; gap:3px; }
  .play-zone .label{ font-size:12px; color:#ffe9b0; margin-right:4px; }
  .play-pass{ color:#ffd9a0; font-size:15px; background:var(--panel); padding:4px 12px; border-radius:12px; }
  .play-left{ position:absolute; top:50%; left:20%; transform:translate(-50%,-50%); }
  .play-right{ position:absolute; top:50%; right:20%; transform:translate(50%,-50%); }
  .play-mine{ position:absolute; left:50%; bottom:150px; transform:translateX(-50%); }
  .play-top{ position:absolute; top:30%; left:50%; transform:translate(-50%,-50%); }
  .my-area{ position:absolute; left:0; right:0; bottom:8px; display:flex; flex-direction:column; align-items:center; z-index:12; }
  .hand{ display:flex; justify-content:center; padding:6px 4px; flex-wrap:nowrap; width:max-content; max-width:100%; margin:0 auto; overflow-x:auto; scrollbar-width:thin; }
  .hand .card{ flex:0 0 auto; margin-left:var(--overlap,-26px); cursor:pointer; transition:transform .12s, box-shadow .12s; position:relative; }
  .hand .card.gap{ margin-left:16px; }
  .hand .card:first-child{ margin-left:0; }
  .hand .card:hover{ transform:translateY(-6px); }
  .hand .card.selected{ transform:translateY(-26px); box-shadow:0 6px 14px rgba(0,0,0,.5); }
  .actions{ display:flex; justify-content:center; gap:12px; margin-top:6px; min-height:44px; }
  .action{
    background:linear-gradient(180deg,#ffe9a8,#e8c15a); color:#3a2c0a;
    border:none; border-radius:10px; padding:10px 22px; font-size:16px; font-weight:800;
    cursor:pointer; font-family:inherit; box-shadow:0 3px 8px rgba(0,0,0,.3);
  }
  .action:hover{ filter:brightness(1.06); }
  .action:disabled{ filter:grayscale(.7); opacity:.55; cursor:not-allowed; }
  .action.alt{ background:linear-gradient(180deg,#cfd8d0,#a9b8ab); color:#23331f; }
  .action.pass{ background:linear-gradient(180deg,#e9c9c3,#cd9f96); color:#5a1f16; }
  .card{
    width:var(--card-w); height:var(--card-h);
    background:linear-gradient(160deg,#ffffff,#eef0f3);
    border-radius:9px; box-shadow:0 2px 5px rgba(0,0,0,.35);
    position:relative; display:inline-flex; flex-direction:column; justify-content:space-between;
    padding:6px 6px; font-weight:800;
  }
  .card .corner{ display:flex; flex-direction:column; line-height:1; font-size:var(--cf,16px); }
  .card .corner .suit{ font-size:calc(var(--cf,16px)*.875); }
  .card .big{ align-self:center; font-size:var(--cfb,30px); line-height:1; }
  .card.red{ color:var(--red); }
  .card.black{ color:var(--black); }
  .card.joker{ justify-content:flex-start; align-items:center; padding:6px; }
  .card.joker .joker-art{ width:100%; height:100%; display:block; }
  .card.joker .jok{ position:absolute; bottom:4px; left:0; right:0; text-align:center; font-size:13px; font-weight:800; letter-spacing:2px; text-shadow:0 1px 1px rgba(255,255,255,.5); }
  .card.joker.joker-big{ background:linear-gradient(160deg,#ffdfb0,#f2a86c); color:#8a2f0d; }
  .card.joker.joker-small{ background:linear-gradient(160deg,#d6dde6,#9aa7b8); color:#232c3a; }
  .card.back{ background:repeating-linear-gradient(45deg, #2a5fa0 0 6px, #244f86 6px 12px); border:2px solid #1a3a66; }
  .card.back::after{ content:""; position:absolute; inset:5px; border-radius:5px; border:1.5px solid rgba(255,255,255,.35); }
  .card.small{ width:calc(var(--card-w)*0.62); height:calc(var(--card-h)*0.62); }
  .card.tiny{ width:calc(var(--card-w)*0.46); height:calc(var(--card-h)*0.46); }
  .play-zone .card{ box-shadow:0 2px 5px rgba(0,0,0,.35); }
  .card .wild-badge{
    /* 逢人配：把“配”字做成牌面本身的一部分，竖排印在牌面右侧，随牌缩放 */
    position:absolute; right:2px; top:10px; bottom:10px; width:15px;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(180deg,#c82020,#8f1212); color:#ffe9a8;
    border-radius:4px; border:1px solid #7a0d0d;
    font-size:13px; font-weight:900; letter-spacing:0;
    writing-mode:vertical-rl;
    box-shadow:0 1px 3px rgba(0,0,0,.35); z-index:5; pointer-events:none;
  }
  .card.wild-gold .corner .suit{ color:#e6b31e; text-shadow:0 0 5px rgba(255,215,0,.55); }
  .play-zone .card .suit.big{ display:none; }
  #overlay{ position:absolute; inset:0; z-index:50; background:rgba(6,20,12,.72); backdrop-filter:blur(3px); display:none; align-items:center; justify-content:center; }
  #overlay.show{ display:flex; }
  .modal{ background:linear-gradient(180deg,#1e6b42,#155635); border:1px solid #e8c15a; border-radius:16px; padding:30px 38px; text-align:center; max-width:88vw; box-shadow:0 12px 40px rgba(0,0,0,.5); }
  .modal h2{ font-size:26px; margin-bottom:10px; color:#ffe9a8; letter-spacing:2px; }
  .modal p{ margin:6px 0; color:#eae4d2; font-size:15px; }
  .modal .big{ font-size:20px; color:#fff; font-weight:800; }
  .modal .actions{ margin-top:18px; }
  .modal .actions .action{ margin:0 6px; }
  @media (max-width:820px){
    :root{ --card-w:52px; --card-h:74px; }
    header{ padding:8px 12px; gap:8px; }
    header .title{ font-size:18px; }
    header .stats{ gap:10px; font-size:12px; }
    .avatar{ width:40px; height:40px; font-size:20px; }
    .seat-left{ top:56px; left:8px; }
    .seat-right{ top:56px; right:8px; }
    .seat-top{ top:56px; }
    .play-left{ left:24%; }
    .play-right{ right:24%; }
    .turn-hint{ font-size:13px; }
    .hand .card{ margin-left:var(--overlap,-18px); }
    .action{ padding:8px 16px; font-size:14px; }
  }
  .scoreboard{ display:flex; align-items:center; gap:14px; background:var(--panel); padding:6px 18px; border-radius:14px; font-size:14px; }
  .scoreboard .sb-line{ display:flex; align-items:center; gap:8px; }
  .scoreboard .sb-line span{ color:#eae4d2; }
  .scoreboard .sb-line b{ font-size:18px; color:#ffd97a; min-width:1.4em; text-align:center; }
  .scoreboard .sb-div{ color:#8fa08f; }
  .bottom-cards .bc-label{ font-size:12px; color:#ffe9b0; margin-right:4px; }
  .flycard{ position:fixed; width:72px; height:100px; z-index:11; pointer-events:none; transition:transform .4s ease-in; }
  .flycard .flipbox{ position:absolute; inset:0; transform-style:preserve-3d; transition:transform .4s ease; }
  .flycard .face{ position:absolute; inset:0; backface-visibility:hidden; border-radius:9px; overflow:hidden; }
  .flycard .back{ background:linear-gradient(135deg,#f0c060,#c67f1a); border:1px solid #b07010; box-shadow:0 4px 14px rgba(0,0,0,.4); }
  .flycard .back::before{ content:'♠'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:28px; color:rgba(255,255,255,.42); }
  .flycard .front{ transform:rotateY(180deg); background:#fff; box-shadow:0 4px 14px rgba(0,0,0,.4); }
  .flycard.flip .flipbox{ transform:rotateY(180deg); }
  @keyframes dealpop{ from{ transform:scale(.82); opacity:.4; } to{ transform:scale(1); opacity:1; } }
  .hand .card.deal-in{ animation:dealpop .28s ease; }
  #dealOverlay{ position:fixed; left:50%; top:46%; transform:translate(-50%,-50%); z-index:99; display:none; text-align:center; pointer-events:none; }
  #dealOverlay .pile{ position:relative; width:72px; height:100px; margin:0 auto; }
  #dealOverlay .pile i{ position:absolute; inset:0; border-radius:9px; background:linear-gradient(135deg,#f0c060,#c67f1a); box-shadow:0 2px 7px rgba(0,0,0,.35); border:1px solid #b07010; }
  #dealOverlay .pile i:nth-child(1){ transform:translate(-6px,-5px); }
  #dealOverlay .pile i:nth-child(2){ transform:translate(-2px,-2px); }
  #dealOverlay .pile i:nth-child(3){ transform:translate(2px,1px); }
  #dealOverlay .pile i:nth-child(4){ transform:translate(6px,4px); }
  #dealOverlay span{ display:block; margin-top:14px; color:#fff; font-weight:700; text-shadow:0 1px 3px rgba(0,0,0,.6); letter-spacing:2px; }
  #dealOverlay .pile i{ animation:dealfloat 1.4s ease-in-out infinite; }
  #dealOverlay .pile i:nth-child(2){ animation-delay:.15s; }
  #dealOverlay .pile i:nth-child(3){ animation-delay:.3s; }
  #dealOverlay .pile i:nth-child(4){ animation-delay:.45s; }
  @keyframes dealfloat{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-6px); } }
  .counter{
    position:absolute; top:172px; right:18px; z-index:12;
    background:var(--panel); border:1px solid rgba(255,255,255,.22);
    border-radius:10px; padding:8px 11px; display:none;
    font-size:12px; width:max-content; pointer-events:none;
  }
  .counter .c-head{ font-weight:800; color:#ffd97a; letter-spacing:2px; font-size:13px; margin-bottom:3px; }
  .counter .c-grid{ display:grid; gap:0 3px; text-align:center; }
  .counter .c-rank{ color:#ffe9c0; font-weight:700; line-height:1.6; padding:0 2px; }
  .counter .c-rank.c-lv{ color:#2b2310; background:#ffd97a; border-radius:4px; }
  .counter .c-rank.c-wild{ color:#fff; background:#c82020; border-radius:4px; }
  .counter .c-num{ color:#fff; font-weight:800; line-height:1.6; }
  /* ===== 主页 ===== */
  body.athome header{ display:none; }
  .home{
    height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:30px;
    background:radial-gradient(120% 120% at 50% 22%, rgba(255,255,255,.05), transparent 60%);
  }
  .home-title{
    font-size:64px; font-weight:900; letter-spacing:14px; margin-left:14px;
    color:#f6e7b0; text-shadow:0 5px 24px rgba(0,0,0,.6), 0 0 0 1px rgba(232,193,90,.25);
  }
  .home-cards{ display:flex; align-items:flex-end; }
  .pcard{
    width:86px; height:122px; border-radius:10px; background:linear-gradient(160deg,#ffffff,#f2ecd9);
    border:1px solid #d8cfa8; box-shadow:0 8px 20px rgba(0,0,0,.45);
    position:relative; margin-left:-26px; margin-top:0; padding:9px; flex:0 0 auto;
    font-weight:800; z-index:1;
  }
  .pcard:first-child{ margin-left:0; }
  .pcard:nth-child(2){ margin-top:-10px; z-index:2; }
  .pcard:nth-child(3){ margin-top:-18px; z-index:3; }
  .pcard:nth-child(4){ margin-top:-10px; z-index:2; }
  .pcard .p-rank{ font-size:22px; line-height:1; }
  .pcard .p-suit{ position:absolute; right:7px; bottom:5px; font-size:30px; }
  .pcard.red{ color:var(--red); }
  .pcard.black{ color:var(--black); }
  .home-btns{ display:flex; gap:26px; margin-top:6px; flex-wrap:wrap; justify-content:center; }
  .hbtn{
    width:150px; padding:24px 0 20px; border-radius:18px; cursor:pointer;
    background:linear-gradient(180deg,#2f9059,#1d6d44);
    border:2px solid #e8c15a; color:#fff;
    font-family:inherit; font-size:21px; font-weight:800; letter-spacing:2px;
    box-shadow:0 8px 20px rgba(0,0,0,.45);
    display:flex; flex-direction:column; align-items:center; gap:12px;
    transition:transform .15s;
  }
  .hbtn:hover{ transform:translateY(-4px); background:linear-gradient(180deg,#37a465,#20834c); }
  .hbtn .hico{ font-size:36px; line-height:1; color:#ffd97a; }
  .home-wkw{ position:absolute; left:18px; bottom:16px; color:rgba(255,255,255,.6); font-size:15px; letter-spacing:3px; font-weight:600; }
  @media (max-width:600px){
    .home-title{ font-size:42px; letter-spacing:8px; }
    .pcard{ width:60px; height:86px; font-size:14px; }
    .pcard .p-suit{ font-size:22px; }
    .pcard:nth-child(3){ margin-top:-12px; }
    .pcard:nth-child(2),.pcard:nth-child(4){ margin-top:-6px; }
    .hbtn{ width:130px; }
  }
</style>
</head>
<body>
<div data-i18n="game.noI18n" style="background:#fff8e6;color:#92610a;border:1px solid #f3dfa2;border-radius:10px;padding:10px 14px;margin:12px auto;max-width:720px;font-size:14px;font-weight:700;text-align:center;">⚠️ 本小游戏由 wkw 制作，暂无英文版。</div>
<div id="app">
  <header>
    <div class="title" id="gameTitle">牌类游戏</div>
    <div class="stats">
      <span id="ddzStats" style="display:none">局数 <b id="sGame">0</b>　得分 <b id="sScore">0</b>　倍数 <b id="sMult">1</b></span>
      <span id="gdStats" style="display:none">级牌 <b id="gLevelHead">2</b>　你方 <b id="gTeamHead">2</b> 级　局数 <b id="gGame">0</b></span>
      <span id="upStats" style="display:none">打 <b id="uLevelHead">2</b>　主牌 <b id="uTrumpHead">♠</b>　庄家 <b id="uDealerHead">你</b>　局数 <b id="uGame">0</b></span>
    </div>
    <button class="btn-ghost" id="btnSwitch">选游戏</button>
    <button class="btn-ghost" id="btnRestart">重开一局</button>
    <button class="btn-ghost" id="btnCounter">记牌器 开</button>
  </header>
  <div id="dealOverlay"><div class="pile"><i></i><i></i><i></i><i></i></div><span>发牌中…</span></div>

  <div class="view" id="view-home">
    <div class="home">
      <div class="home-title">牌类游戏</div>
      <div class="home-cards">
        <div class="pcard black"><span class="p-rank">A</span><span class="p-suit">♠</span></div>
        <div class="pcard red"><span class="p-rank">K</span><span class="p-suit">♥</span></div>
        <div class="pcard black"><span class="p-rank">Q</span><span class="p-suit">♣</span></div>
        <div class="pcard red"><span class="p-rank">J</span><span class="p-suit">♦</span></div>
        <div class="pcard black"><span class="p-rank">10</span><span class="p-suit">♠</span></div>
      </div>
            <div class="home-wkw">WKW 制作</div>
<div class="home-btns">
        <button class="hbtn" onclick="switchTo('ddz')"><span class="hico">♠</span>斗地主</button>
        <button class="hbtn" onclick="switchTo('gd')"><span class="hico">♥</span>掼蛋</button>
        <button class="hbtn" onclick="switchTo('up')"><span class="hico">♣</span>升级</button>
      </div>
      
    </div>
  </div>

  <div class="view" id="view-ddz">
    <div class="seat seat-left" id="seat-1">
      <div class="seat-line">
        <div class="clock" id="clock-1"><span class="cd">90</span></div>
        <div class="avatar-row">
          <div class="avatar">财</div>
          <div class="seat-info"><div class="name">小财</div><div class="tag" id="tag-1">农民</div></div>
        </div>
      </div>
      <div class="card-count" id="count-1"></div>
    </div>
    <div class="seat seat-right" id="seat-2">
      <div class="seat-line">
        <div class="avatar-row">
          <div class="avatar">王</div>
          <div class="seat-info"><div class="name">老王</div><div class="tag" id="tag-2">农民</div></div>
        </div>
        <div class="clock" id="clock-2"><span class="cd">90</span></div>
      </div>
      <div class="card-count" id="count-2"></div>

let _uid = 0;
function makeDeck(n){
  const deck=[];
  for(let k=0;k<n;k++) for(let v=3;v<=15;v++) ['s','h','c','d'].forEach(s=> deck.push({v, s, uid:_uid++}));
  for(let k=0;k<n;k++) deck.push({v:16,s:null,uid:_uid++});
  for(let k=0;k<n;k++) deck.push({v:17,s:null,uid:_uid++});
  return deck;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
let dealSeq=0, dealingNow=false;
function dealAnim(deck, n, players, targets, renderFn, done){
  dealingNow=true;
  const myId=++dealSeq;
  const ov=document.getElementById('dealOverlay'); if(ov) ov.style.display='block';
  const P=players.length;
  const per=Math.floor(n/P);
  for(let pl=1; pl<P; pl++) players[pl].hand = deck.slice(pl*per, (pl+1)*per);
  const handEl=document.getElementById(targets[0]);
  const f=ov.getBoundingClientRect();
  const x0=f.left+f.width/2, y0=f.top+f.height/2;
  const root=getComputedStyle(document.documentElement);
  const baseW=parseFloat(root.getPropertyValue('--card-w'))||74;
  const baseH=parseFloat(root.getPropertyValue('--card-h'))||104;
  const baseOverlap= baseW>=70?26:18;
  const perBase=baseW-baseOverlap;
  const avail=Math.min(window.innerWidth*0.92,720);
  let cw=baseW, ch=baseH;
  if(per>20 && per*perBase>avail){ const pd=avail/per; const scale=Math.min(1,pd/perBase); cw=Math.max(40,Math.round(baseW*scale)); ch=Math.round(baseH*scale); }
  const cf=Math.max(8,Math.round(16*cw/baseW))+'px', cfb=Math.max(12,Math.round(30*cw/baseW))+'px';
  handEl.style.setProperty('--card-w',cw+'px'); handEl.style.setProperty('--card-h',ch+'px');
  handEl.style.setProperty('--cf',cf); handEl.style.setProperty('--cfb',cfb);
  const my=deck.slice(0, per);
  players[0].hand=[];
  try{renderFn();}catch(e){}
  let i=0, guard=null;
  const finish=()=>{
    if(guard) clearTimeout(guard);
    dealingNow=false;
    document.querySelectorAll('.flycard').forEach(f=>f.remove());
    if(ov) ov.style.display='none';
    try{renderFn();}catch(e){}
    try{done();}catch(e){}
  };
  // 保底完成：即使动画链某环中断，也强制收尾，避免一直停在“发牌中”
  guard=setTimeout(()=>{ if(myId!==dealSeq) return; finish(); }, per*450+1200);
  const dealOne=()=>{
    if(myId!==dealSeq) return;
    if(i>=per){ finish(); return; }
    try{
      const card=my[i];
      const r=handEl.getBoundingClientRect();
      const x1=r.left+cw/2-14, y1=r.top+r.height/2-ch/2;
      const fly=document.createElement('div'); fly.className='flycard';
      fly.style.width=cw+'px'; fly.style.height=ch+'px';
      fly.style.left=x0+'px'; fly.style.top=y0+'px';
      fly.innerHTML='<div class="flipbox"><div class="face back"></div><div class="face front"></div></div>';
      const front=fly.querySelector('.front');
      front.style.setProperty('--card-w',cw+'px'); front.style.setProperty('--card-h',ch+'px');
      front.style.setProperty('--cf',cf); front.style.setProperty('--cfb',cfb);
      front.appendChild(cardEl(card));
      document.body.appendChild(fly);
      const dx=x1-x0, dy=y1-y0;
      requestAnimationFrame(()=>{ fly.style.transform='translate('+dx+'px,'+dy+'px)'; });
      // 飞行途中直接翻面：起飞即开始翻转，与 .5s 飞行动画同步，到位时已翻成正面
      setTimeout(()=>{ if(myId===dealSeq) fly.classList.add('flip'); }, 40);
      setTimeout(()=>{
        if(myId!==dealSeq){ fly.remove(); return; }
        fly.remove();
        players[0].hand.unshift(card);
        try{
          const el=cardEl(card); el.dataset.uid=card.uid; el.classList.add('deal-in');
          handEl.insertBefore(el, handEl.firstChild);
        }catch(e){}
        i++; dealOne();
      }, 480);
    }catch(err){ i++; dealOne(); }
  };
  dealOne();
}
function consecutive(vals){ for(let i=1;i<vals.length;i++) if(vals[i]!==vals[i-1]+1) return false; return true; }
function jokerSVG(v){

function adaptHand(box,n){
  if(n<=0) return;
  const card=box.querySelector('.card'); if(!card) return;
  const root=getComputedStyle(document.documentElement);
  const baseW=parseFloat(root.getPropertyValue('--card-w'))||74;
  const baseH=parseFloat(root.getPropertyValue('--card-h'))||104;
  const baseOverlap= baseW>=70?26:18;
  const perBase=baseW-baseOverlap;
  box.style.removeProperty('--card-w');
  box.style.removeProperty('--card-h');
  box.style.removeProperty('--overlap');
  box.style.removeProperty('--cf');
  box.style.removeProperty('--cfb');
  const avail=Math.min(window.innerWidth*0.92, 720);
  if(n*perBase>avail){
    const per=avail/n;
    const scale=Math.min(1, per/perBase);
    const cw=Math.max(40, Math.round(baseW*scale));
    box.style.setProperty('--card-w',cw+'px');
    box.style.setProperty('--card-h',Math.round(baseH*scale)+'px');
    const overlap=Math.max(5, Math.round(cw-per));
    box.style.setProperty('--overlap',(-overlap)+'px');
    box.style.setProperty('--cf',Math.max(8,Math.round(16*scale))+'px');
    box.style.setProperty('--cfb',Math.max(12,Math.round(30*scale))+'px');
  }
}
function cardEl(c, size){

  }else{

    d.classList.add(red?'red':'black');
    d.innerHTML='<div class="corner"><span class="rank">'+RANK[c.v]+'</span><span class="suit">'+SUITSYM[c.s]+'</span></div>'
      +'<div class="suit big">'+SUITSYM[c.s]+'</div>';
  }
  if(currentGame==='gd' && typeof gdIsWild==='function'){ try{ if(gdIsWild(c)){ d.classList.add('wild-gold'); } }catch(e){} }
  return d;
}

let currentTurn = ()=>-1;
let currentRestart = ()=>{};

}

let ddzToastT=null;
function ddzToast(msg){
  const h=document.getElementById('turnHint'); h.innerHTML='<span class="turn">'+msg+'</span>';
  clearTimeout(ddzToastT);
  ddzToastT=setTimeout(()=>{ if(currentGame==='ddz'&&game.phase==='playing') document.getElementById('turnHint').innerHTML='<span class="turn">轮到你了，请出牌</span>'; },1800);

const game={
  players:[ {name:'你', hand:[], lastPass:false}, {name:'小财', hand:[], lastPass:false}, {name:'老王', hand:[], lastPass:false} ],
  bottom:[], landlordIdx:-1, multiplier:1,
  turn:-1, currentPlay:null, lastPlayBy:[null,null,null],
  phase:'idle', revealBottom:false,
  totalGames:0, score:0
};
function ddzClassify(cards){
  const n=cards.length;
  const vs=cards.map(c=>c.v).sort((a,b)=>a-b);
  if(n===0) return null;
  if(n===2 && vs.includes(16) && vs.includes(17)) return {type:'rocket', mainV:17, size:n};
  const cnt={}; vs.forEach(v=>cnt[v]=(cnt[v]||0)+1);
  const entries=Object.entries(cnt).map(([v,c])=>[+v,c]).sort((a,b)=>a[0]-b[0]);
  const maxV=Math.max(...vs);
  if(n===1) return {type:'single', mainV:vs[0], size:n};
  if(entries.length===1){
    const [v,c]=entries[0];
    if(c===2 && v<16) return {type:'pair', mainV:v, size:n};
    if(c===3 && v<16) return {type:'triple', mainV:v, size:n};
    if(c===4 && v<16) return {type:'bomb', mainV:v, size:n};
    return null;
  }
  if(n===4){ const t=entries.find(e=>e[1]===3); if(t) return {type:'triple1', mainV:t[0], size:n}; }
  if(n===5){ const t=entries.find(e=>e[1]===3), p=entries.find(e=>e[1]===2); if(t&&p) return {type:'triple2', mainV:t[0], size:n}; }
  if(n===6){ const f=entries.find(e=>e[1]===4); if(f && entries.every(e=>e[1]===4||e[1]===1)) return {type:'four2', mainV:f[0], size:n}; }
  if(n===8){ const f=entries.find(e=>e[1]===4); if(f && entries.every(e=>e[1]===4||e[1]===2)) return {type:'four2pair', mainV:f[0], size:n}; }
  if(entries.every(e=>e[1]===1) && n>=5 && maxV<=14 && consecutive(entries.map(e=>e[0])))
    return {type:'straight', mainV:maxV, size:n, len:n};
  if(entries.every(e=>e[1]===2) && entries.length>=3 && maxV<=14 && consecutive(entries.map(e=>e[0])))
    return {type:'straightpair', mainV:maxV, size:n, len:entries.length};
  const triples=entries.filter(e=>e[1]===3).map(e=>e[0]);
  if(triples.length>=2 && maxV<=14 && consecutive(triples)){
    const m=triples.length, total=entries.reduce((s,e)=>s+e[1],0);
    if(total===4*m && entries.every(e=>e[1]===3||e[1]===1)) return {type:'plane1', mainV:triples[triples.length-1], size:n, len:m};
    if(total===5*m && entries.every(e=>e[1]===3||e[1]===2)) return {type:'plane2', mainV:triples[triples.length-1], size:n, len:m};
    if(entries.length===m && total===3*m) return {type:'plane', mainV:triples[triples.length-1], size:n, len:m};
  }
  return null;
}
function ddzCanBeat(nw, cur){
  if(!cur) return true;
  if(nw.type==='rocket') return true;
  if(cur.type==='rocket') return false;
  if(nw.type==='bomb'){ if(cur.type==='bomb') return nw.mainV>cur.mainV; return true; }
  if(cur.type==='bomb') return false;
  if(nw.type!==cur.type) return false;
  if(nw.size!==cur.size) return false;
  const lenTypes=['straight','straightpair','plane','plane1','plane2'];
  if(lenTypes.includes(nw.type) && nw.len!==cur.len) return false;
  return nw.mainV>cur.mainV;
}
function ddzCardsOf(hand, cnt, v, k){
  const out=[]; for(const c of hand) if(c.v===v && out.length<k) out.push(c); return out;
}
function ddzCombos(hand){
  const cnt={}; hand.forEach(c=>cnt[c.v]=(cnt[c.v]||0)+1);
  const res=[];
  const add=(cards)=>{ const cl=ddzClassify(cards); if(cl) res.push({cards:cards.slice(), combo:cl}); };
  const vs=Object.keys(cnt).map(Number).filter(v=>cnt[v]>0).sort((a,b)=>a-b);
  vs.forEach(v=> add(ddzCardsOf(hand,cnt,v,1)));
  vs.forEach(v=>{ if(cnt[v]>=2 && v<16) add(ddzCardsOf(hand,cnt,v,2)); });
  vs.forEach(v=>{
    if(cnt[v]>=3 && v<16){
      const t=ddzCardsOf(hand,cnt,v,3); add(t);
      vs.forEach(w=>{ if(cnt[w]>=1 && w!==v) add(t.concat(ddzCardsOf(hand,cnt,w,1))); });
      vs.forEach(w=>{ if(cnt[w]>=2 && w!==v) add(t.concat(ddzCardsOf(hand,cnt,w,2))); });
    }
  });
  vs.forEach(v=>{
    if(cnt[v]>=4 && v<16){
      const f=ddzCardsOf(hand,cnt,v,4); add(f);
      const rest=vs.filter(w=>w!==v);
      for(let i=0;i<rest.length;i++)for(let j=i+1;j<rest.length;j++){
        if(cnt[rest[i]]>=1&&cnt[rest[j]]>=1) add(f.concat(ddzCardsOf(hand,cnt,rest[i],1),ddzCardsOf(hand,cnt,rest[j],1)));
      }
      const pairs=rest.filter(w=>cnt[w]>=2);
      for(let i=0;i<pairs.length;i++)for(let j=i+1;j<pairs.length;j++)
        add(f.concat(ddzCardsOf(hand,cnt,pairs[i],2),ddzCardsOf(hand,cnt,pairs[j],2)));
    }
  });
  const ranks=vs.filter(v=>v<=14);
  for(let s=0;s<ranks.length;s++) for(let len=5;len<=ranks.length-s;len++){
    const win=ranks.slice(s,s+len); if(win.length<len) break;
    if(consecutive(win) && win.every(v=>cnt[v]>=1)) add(win.reduce((a,v)=>a.concat(ddzCardsOf(hand,cnt,v,1)),[]));
  }
  for(let s=0;s<ranks.length;s++) for(let len=3;len<=ranks.length-s;len++){
    const win=ranks.slice(s,s+len); if(win.length<len) break;
    if(consecutive(win) && win.every(v=>cnt[v]>=2)) add(win.reduce((a,v)=>a.concat(ddzCardsOf(hand,cnt,v,2)),[]));
  }
  const triRanks=ranks.filter(v=>cnt[v]>=3);
  for(let s=0;s<triRanks.length;s++) for(let len=2;len<=triRanks.length-s;len++){
    const win=triRanks.slice(s,s+len); if(win.length<len) break;
    if(consecutive(win)){
      const tCards=win.reduce((a,v)=>a.concat(ddzCardsOf(hand,cnt,v,3)),[]);
      const used=new Set(win); const wings=ranks.filter(v=>!used.has(v));
      add(tCards);
      const singles=wings.filter(v=>cnt[v]>=1).slice(0,len);
      if(singles.length===len) add(tCards.concat(singles.reduce((a,v)=>a.concat(ddzCardsOf(hand,cnt,v,1)),[])));
      const pw=wings.filter(v=>cnt[v]>=2).slice(0,len);
      if(pw.length===len) add(tCards.concat(pw.reduce((a,v)=>a.concat(ddzCardsOf(hand,cnt,v,2)),[])));
    }
  }
  return res;
}
function aiArrange(hand, guandan){
  const order={'s':0,'h':1,'c':2,'d':3};
  const used=new Set();
  const blocks=[];
  const cnt={}; hand.forEach(c=>cnt[c.v]=(cnt[c.v]||0)+1);
  const left=Object.assign({},cnt);
  const byV={}; hand.forEach(c=>{(byV[c.v]=byV[c.v]||[]).push(c);});
  const take=(v,k)=>{ if((left[v]||0)<k) return []; const out=[]; for(const c of (byV[v]||[])){ if(!used.has(c.uid)&&out.length<k){ used.add(c.uid); out.push(c); } } left[v]-=out.length; return out; };
  const push=a=>{ if(a&&a.length) blocks.push(a.slice()); };
  const sortB=a=> a.slice().sort((x,y)=> x.v-y.v || order[x.s]-order[y.s]);
  const segs=(arr,pred)=>{ const out=[]; let a=0; while(a<arr.length){ while(a<arr.length&&!pred(arr[a])) a++; if(a>=arr.length) break; let b=a; while(b+1<arr.length&&pred(arr[b+1])) b++; out.push(arr.slice(a,b+1)); a=b+1; } return out; };
  if(guandan){ const w=hand.filter(c=>c.v>=16&&!used.has(c.uid)); if(w.length>=4){ const w4=w.slice(0,4); w4.forEach(c=>{used.add(c.uid); left[c.v]-=1;}); push(w4); } }
  else { const j=take(16,1), d=take(17,1); if(j.length&&d.length) push([...j,...d]); }
  const bombVs=Object.keys(left).map(Number).filter(v=>guandan?left[v]>=4:left[v]===4).sort((a,b)=>a-b);
  bombVs.forEach(v=>{ const cs=take(v,guandan?left[v]:4); if(cs.length) push(sortB(cs)); });
  if(guandan){
    const bySuit={};
    hand.forEach(c=>{ if(c.v>=3&&c.v<=14&&!used.has(c.uid)) (bySuit[c.s]=bySuit[c.s]||[]).push(c); });
    for(const s in bySuit){
      const arr=[...new Set(bySuit[s].map(c=>c.v))].sort((a,b)=>a-b);
      let i=0;
      while(i<arr.length){
        let j=i; while(j+1<arr.length&&arr[j+1]-arr[j]===1) j++;
        for(let k=j;k-i+1>=5;k--){ const sg=arr.slice(k-4,k+1);
          if(sg.every(v=>left[v]>=1)){
            const cs=sg.map(v=>{ const c=bySuit[s].find(x=>x.v===v&&!used.has(x.uid)); if(c){ used.add(c.uid); left[v]-=1; return c; } return null; }).filter(Boolean);
            if(cs.length===sg.length){ push(sortB(cs)); break; }
          }
        }
        i=j+1;
      }
    }
  }
  const pts=[...new Set(hand.map(c=>c.v))].filter(v=>v>=3&&v<=14).sort((a,b)=>a-b);
  const bigSegs=segs(pts, ()=>true);
  for(const big of bigSegs){
    segs(big, v=>left[v]>=3).forEach(rs=>{
      if(rs.length>=2){ const cs=rs.map(v=>take(v,3)).filter(x=>x.length===3).flat();
        if(cs.length===rs.length*3) push(sortB(cs)); } });
    segs(big, v=>left[v]===2).forEach(rs=>{
      const ts=guandan ? (rs.length>=3? rs.slice(0,3):[]) : (rs.length>=3? rs:[]);
      if(ts.length>=3){ const cs=ts.map(v=>take(v,2)).filter(x=>x.length===2).flat();
        if(cs.length===ts.length*2) push(sortB(cs)); } });
    segs(big, v=>left[v]===1).forEach(rs=>{
      if(rs.length>=5){ const cs=rs.map(v=>take(v,1)).filter(x=>x.length===1).flat();
        if(cs.length===rs.length) push(sortB(cs)); } });
  }
  const allV=Object.keys(left).map(Number).sort((a,b)=>a-b);
  allV.forEach(v=>{ if(left[v]>=3){
    const t3=take(v,3); if(t3.length<3) return;
    let wing=[];
    const p=allV.find(w=>w!==v&&left[w]>=2);
    if(p!==undefined){ const d=take(p,2); if(d.length===2) wing=d; }
    if(!wing.length&&!guandan){ const s=allV.find(w=>w!==v&&left[w]>=1); if(s!==undefined){ const d=take(s,1); if(d.length) wing=d; } }
    push(sortB([...t3,...wing])); } });
  allV.forEach(v=>{ const d=take(v,2); if(d.length===2) push(sortB(d)); });
  const singles=hand.filter(c=>!used.has(c.uid)); singles.forEach(c=> push([c]));
  const valOf=c=>guandan?gdEff(c.v):c.v;
  blocks.sort((a,b)=> Math.max(...a.map(valOf)) - Math.max(...b.map(valOf)));
  const cards=blocks.flat();
  const group={}; blocks.forEach((b,idx)=> b.forEach(c=>group[c.uid]=idx));
  return {cards:cards, group:group};
}

function ddzHandScore(hand){
  let s=0;
  hand.forEach(c=>{ if(c.v===17) s+=3.2; else if(c.v===16) s+=2.2; else if(c.v===15) s+=1.0; else if(c.v===14) s+=0.8; else if(c.v===13) s+=0.5; });
  const cnt={}; hand.forEach(c=>cnt[c.v]=(cnt[c.v]||0)+1);
  for(const v in cnt){ if(cnt[v]===4) s+=4; else if(cnt[v]===3) s+=1.2; else if(cnt[v]===2) s+=0.4; }
  if(cnt[16]&&cnt[17]) s+=2;
  return s;
}

function ddzComboName(cl){
  const map={ single:'单张', pair:'对子', triple:'三张', triple1:'三带一', triple2:'三带二', straight:'顺子', straightpair:'连对', plane:'飞机', plane1:'飞机带单', plane2:'飞机带对', four2:'四带二', four2pair:'四带两对', bomb:'炸弹', rocket:'火箭' };
  return map[cl.type]||'';
}
function ddzCardStr(cards){ return cards.map(c=> c.v===16?'小王':(c.v===17?'大王':RANK[c.v])).join(' '); }
function ddzPlayCards(idx, cards){
  if(!cards || !cards.length) return;
  const p=game.players[idx]; const cl=ddzClassify(cards);
  const remove=new Set(cards.map(c=>c.uid));
  p.hand=p.hand.filter(c=>!remove.has(c.uid));
  p.lastPass=false; game.currentPlay={idx, combo:cl}; game.lastPlayBy[idx]=cards;
  if(cl.type==='bomb'||cl.type==='rocket') game.multiplier*=2;
  const label = cl.type==='rocket' ? '火箭 大王 小王' : (ddzComboName(cl)+' '+ddzCardStr(cards));
  ddzTurnHint((idx===0?'你':game.players[idx].name)+' 出了 '+label);
  ddzRenderMult(); ddzRenderCounts(); ddzRenderPlay();
  if(p.hand.length===0){ ddzEndGame(idx); return; }
  game.turn=(idx+1)%3; setTimeout(ddzDoTurn, 800);
}
function ddzSideIdx(i){ return i===game.landlordIdx?'landlord':'farmer'; }
function ddzIsRun(t){ return t==='straight'||t==='straightpair'||t==='plane'||t==='plane1'||t==='plane2'; }
function ddzChooseLead(hand){
  const go=ddzClassify(hand); if(go) return hand.slice();
  const all=ddzCombos(hand);
  const normal=all.filter(c=>c.combo.type!=='bomb'&&c.combo.type!=='rocket');
  const pool=normal.length? normal : all;
  const prio=(combo)=>{ if(!ddzIsRun(combo.type)) return 2; if(combo.mainV<=12||combo.size>=8) return 0; return 1; };
  pool.sort((a,b)=> prio(a.combo)-prio(b.combo) || a.combo.mainV-b.combo.mainV || b.cards.length-a.cards.length);
  if(!pool.length){ const c=[...hand].sort((a,b)=>a.v-b.v)[0]; return c?[c]:[]; }
  return pool[0].cards;
}
function ddzChooseFollow(hand, cur, owner, me){
  const mySide=ddzSideIdx(me), ownSide=ddzSideIdx(owner);
  const all=ddzCombos(hand);
  const same=all.filter(c=>c.combo.type===cur.type && ddzCanBeat(c.combo,cur)).sort((a,b)=>a.combo.mainV-b.combo.mainV||a.cards.length-b.cards.length);
  const myCount=game.players[me].hand.length, ownCount=game.players[owner].hand.length;
  const opponent = ownSide!==mySide; const opponentClose = opponent && ownCount<=2;
  if(!opponent){
    // 队友出牌：队友快赢(≤2张)不压让队友走；否则打单牌/小牌时用最小的牌过牌接应
    if(ownCount<=2) return null;
    if(same.length){ const c=same[0]; if(c.combo.mainV<=13) return c.cards; return null; }
    return null;
  }
  if(opponentClose){
    if(same.length) return same[0].cards;
    const bombs=all.filter(c=>c.combo.type==='bomb').sort((a,b)=>a.combo.mainV-b.combo.mainV);
    if(bombs.length) return bombs[0].cards;
    const rocket=all.find(c=>c.combo.type==='rocket'); if(rocket) return rocket.cards;
    return null;
  }
  if(same.length){
    const c=same[0];
    if(c.combo.mainV>=15 && myCount>3 && !opponentClose) return null;
    return c.cards;
  }
  if(cur.type!=='bomb' && cur.type!=='rocket'){
    const bombs=all.filter(c=>c.combo.type==='bomb').sort((a,b)=>a.combo.mainV-b.combo.mainV);
    if(bombs.length && myCount<=5) return bombs[0].cards;
    const rocket=all.find(c=>c.combo.type==='rocket'); if(rocket && myCount<=3) return rocket.cards;
  }
  return null;
}
function ddzEndGame(winIdx){
  game.phase='over'; document.body.classList.remove('playing'); stopTimer();
  const landlordWin=(winIdx===game.landlordIdx);
  const humanSide=(game.landlordIdx===0);
  const humanWin = landlordWin===humanSide;
  const gain=(landlordWin?1:-1)*game.multiplier;
  if(humanWin) game.score+=gain; else game.score-=gain;
  ddzRenderStats();
  const title = humanWin?'你赢了！':'你输了';
  const rs = humanWin?'胜利':'失败';
  openModal(title, rs+' · '+game.players[game.landlordIdx].name+'是地主 · 倍数 ×'+game.multiplier+(humanWin?'':'　得分 '+game.score), [
    {label:'再来一局', cb:()=>ddzNewGame()},
    {label:'换游戏', cls:'alt', cb:()=>showStart()}
  ]);
}

let gdToastT=null;
function gdToast(msg){
  const h=document.getElementById('gTurnHint'); h.innerHTML='<span class="turn">'+msg+'</span>';
  clearTimeout(gdToastT);
  gdToastT=setTimeout(()=>{ if(currentGame==='gd'&&gdGame.phase==='playing') document.getElementById('gTurnHint').innerHTML='<span class="turn">轮到你了，请出牌</span>'; },1800);
}
function gdTurnHint(msg){ document.getElementById('gTurnHint').innerHTML='<span class="turn">'+msg+'</span>'; }
function gdLevelV(){ return gdGame.level===0 ? 15 : gdGame.level+2; }
function gdIsWild(c){ return c.s==='h' && c.v===gdLevelV(); }
function gdEff(v){
  const lv = gdLevelV();
  if(v===17) return 18;
  if(v===16) return 17;
  if(v===lv) return 15;
  if(v===15) return 16;
  return v;
}
function gdCardName(c){
  if(c.v===16) return '小王';
  if(c.v===17) return '大王';
  return RANK[c.v]+SUITSYM[c.s];
}
function gdComboName(cl){
  const map={ single:'单张', pair:'对子', triple:'三张', triple2:'三带二',
              straight:'顺子', straightpair:'连对', plane:'钢板',
              bomb:'炸弹', rocket:'天王炸', straightflush:'同花顺' };
  return map[cl.type]||'';
}
function gdClassify(cards){
  const n=cards?cards.length:0; if(!n) return null;
  const lv=gdLevelV();
  let wild=0; const core=[];
  cards.forEach(c=>{ if(c.s==='h'&&c.v===lv) wild++; else core.push(c); });
  const g=new Map();
  core.forEach(c=>{ const e=gdEff(c.v); g.set(e,(g.get(e)||0)+1); });
  const evs=[...g.keys()].sort((a,b)=>a-b);
  const fit=(needArr)=>{
    const gg=new Map(g); let w=wild;
    for(const [v,k] of needArr){
      const have=gg.get(v)||0;
      const use=Math.min(have,k);
      gg.set(v,have-use);
      const d=k-use;
      if(d>0){ if(w<d) return false; w-=d; }
    }
    for(const [,c] of gg) if(c>0) return false;
    return w===0;
  };
  if(n===4 && wild===0 && core.every(c=>c.v>=16)) return {type:'rocket',mainV:18,size:n};
  if(n>=4 && evs.length<=1) return {type:'bomb',mainV:evs.length?evs[0]:15,size:n,count:n};
  if(n>=5 && core.length>0){
    const suits=new Set(core.map(c=>c.s));
    if(suits.size===1 && evs.length===core.length && evs.every(e=>e>=3&&e<=14)){
      const span=evs[evs.length-1]-evs[0]+1;
      if(span===n) return {type:'straightflush',mainV:evs[evs.length-1],size:n,len:n};
    }
  }
  const runTry=(m,kmin)=>{
    const k=n/m;
    if(!Number.isInteger(k)||k<kmin) return null;
    for(let s=3;s+k-1<=14;s++){
      const need=[]; for(let i=0;i<k;i++) need.push([s+i,m]);
      if(fit(need)) return {type: m===1?'straight':(m===2?'straightpair':'plane'), mainV:s+k-1, size:n, len:k};
    }
    return null;
  };
  let r;
  if((r=runTry(1,5))) return r;
  if((r=runTry(2,3))) return r;
  if((r=runTry(3,2))) return r;
  if(n===5){
    for(let v=16;v>=3;v--){
      for(let w=16;w>=3;w--){
        if(w===v) continue;
        if(fit([[v,3],[w,2]])) return {type:'triple2',mainV:v,size:n};
      }
    }
  }
  if(n===3 && evs.length<=1) return {type:'triple', mainV:evs.length?evs[0]:15, size:n};
  if(n===2 && evs.length<=1) return {type:'pair', mainV:evs.length?evs[0]:15, size:n};
  if(n===1) return {type:'single', mainV:evs.length?evs[0]:15, size:n};
  return null;
}
function gdCanBeat(nw, cur){
  if(!cur) return true;
  if(nw.type==='rocket') return true;
  if(cur.type==='rocket') return false;
  const bombP=(cl)=>{ if(cl.type==='rocket') return 100; if(cl.type==='straightflush') return 5.5; if(cl.type==='bomb') return (cl.count||4); return 0; };
  const np=bombP(nw), cp=bombP(cur);
  if(np&&cp){ if(np!==cp) return np>cp; return nw.mainV>cur.mainV; }
  if(np) return true;
  if(cp) return false;
  if(nw.type!==cur.type) return false;
  if(nw.size!==cur.size) return false;
  return nw.mainV>cur.mainV;
}
function gdCombos(hand){
  const lv=gdLevelV();
  const isW=c=>(c.s==='h'&&c.v===lv);
  const wilds=hand.filter(isW);
  const norm=hand.filter(c=>!isW(c));
  const byE={};
  norm.forEach(c=>{ const e=gdEff(c.v); (byE[e]=byE[e]||[]).push(c); });
  const out=[]; const seen=new Set();
  const emit=(cards)=>{
    if(!cards||!cards.length) return;
    const cl=gdClassify(cards);
    if(!cl) return;
    const key=cards.map(c=>c.uid).sort((a,b)=>a-b).join(',');
    if(seen.has(key)) return; seen.add(key);
    out.push({cards:cards.slice(), combo:cl});
  };
  const build=(needArr)=>{
    const used=new Set(); const res=[]; let wi=0;
    for(const [v,k] of needArr){
      const pool=(byE[v]||[]).filter(c=>!used.has(c.uid));
      const take=pool.slice(0,k);
      take.forEach(c=>used.add(c.uid));
      res.push(...take);
      let d=k-take.length;
      while(d>0){ if(wi>=wilds.length) return null; res.push(wilds[wi++]); d--; }
    }
    return res;
  };
  const jokers=norm.filter(c=>c.v>=16);
  if(jokers.length>=4) emit(jokers.slice(0,4));
  for(let e=3;e<=16;e++){
    const have=(byE[e]||[]).length;
    const maxK=Math.min(8, have+wilds.length);
    for(let k=1;k<=maxK;k++){
      const c=build([[e,k]]);
      if(c) emit(c);
    }
  }
  for(let v=3;v<=16;v++){
    for(let w=3;w<=16;w++){
      if(v===w) continue;
      const c=build([[v,3],[w,2]]);
      if(c) emit(c);
    }
  }
  for(let len=5;len<=12;len++){
    for(let s=3;s+len-1<=14;s++){
      const need=[]; for(let i=0;i<len;i++) need.push([s+i,1]);
      const c=build(need); if(c) emit(c);
    }
  }
  for(let s=3;s+2<=14;s++){
    const c=build([[s,2],[s+1,2],[s+2,2]]);
    if(c) emit(c);
  }
  for(let s=3;s+1<=14;s++){
    const c=build([[s,3],[s+1,3]]);
    if(c) emit(c);
  }
  ['s','h','c','d'].forEach(su=>{
    const arr=norm.filter(c=>c.s===su && c.v>=3 && c.v<=14);
    const byEff={};
    arr.forEach(c=>{ const e=gdEff(c.v); (byEff[e]=byEff[e]||[]).push(c); });
    for(let len=5;len<=12;len++){
      for(let s=3;s+len-1<=14;s++){
        const used=new Set(); const res=[]; let wi=0; let ok=true;
        for(let i=0;i<len;i++){
          const e=s+i;
          const pool=(byEff[e]||[]).filter(c=>!used.has(c.uid));
          if(pool.length){ used.add(pool[0].uid); res.push(pool[0]); }
          else { if(wi>=wilds.length){ ok=false; break; } res.push(wilds[wi++]); }
        }
        if(ok) emit(res);
      }
    }
  });
  return out;
}
function gdRenderHand(){
  const box=document.getElementById('gHand'); box.innerHTML='';
  const order={'s':0,'h':1,'c':2,'d':3};
  const hand = gdGame.aiSorted ? gdGame.players[0].hand.slice() : gdGame.players[0].hand.slice().sort((a,b)=> gdEff(a.v)-gdEff(b.v) || (order[a.s]-order[b.s]));
  hand.forEach((c,i)=>{
    const el=cardEl(c); el.dataset.uid=c.uid;
    if(gdGame.aiSorted&&gdGame.aiGroups&&i>0&&gdGame.aiGroups[c.uid]!==gdGame.aiGroups[hand[i-1].uid]) el.classList.add('gap');
    el.addEventListener('click',()=>el.classList.toggle('selected'));
    box.appendChild(el);
  });
  adaptHand(box, hand.length);
  gdCounterUpdate();
}
function gdSelectedCards(){
  return Array.from(document.querySelectorAll('#gHand .card.selected')).map(el=>{
    const uid=+el.dataset.uid; return gdGame.players[0].hand.find(c=>c.uid===uid);
  }).filter(Boolean);
}
function gdRenderCounts(){
  for(let i=1;i<=3;i++){
    const n=gdGame.players[i].hand.length;
    const box=document.getElementById('gCount-'+i); box.innerHTML='';
    for(let k=0;k<Math.min(n,14);k++) box.appendChild(backEl('cb'));
    if(n>14){ const s=document.createElement('span'); s.textContent='+'+(n-14); s.style.fontSize='12px'; box.appendChild(s); }
  }
}
function gdRenderSeatActive(){
  for(let i=0;i<4;i++){ const el=document.getElementById('gSeat-'+i); if(el) el.classList.remove('active'); }
  if(gdGame.turn>=0){ const el=document.getElementById('gSeat-'+gdGame.turn); if(el) el.classList.add('active'); }
}
function gdRenderPlay(){
  for(let i=0;i<4;i++){
    const zone=document.getElementById('gPlay-'+i); zone.innerHTML='';
    if(gdGame.lastPlayBy[i] && gdGame.lastPlayBy[i].length) gdGame.lastPlayBy[i].forEach(c=> zone.appendChild(cardEl(c,'small')));
    else if(gdGame.players[i].lastPass){ const s=document.createElement('div'); s.className='play-pass'; s.textContent='不出'; zone.appendChild(s); }
  }
}
function gdRenderStats(){
  document.getElementById('gLevel').textContent='级牌 '+LEVELS[gdGame.level];
  document.getElementById('gLevelHead').textContent=LEVELS[gdGame.level];
  document.getElementById('gTeamHead').textContent=LEVELS[gdGame.teamLevel[0]];
  document.getElementById('gGame').textContent=gdGame.roundNo;
  document.getElementById('gdStats').style.display='';
  document.getElementById('ddzStats').style.display='none';
  document.getElementById('upStats').style.display='none';
}
function gdRenderActions(list){
  const box=document.getElementById('gActions'); box.innerHTML='';
  const sb=document.createElement('button'); sb.className='action alt'; sb.textContent='理牌';
  sb.onclick=()=>{ if(dealingNow) return; const r=aiArrange(gdGame.players[0].hand,true); gdGame.players[0].hand=r.cards; gdGame.aiGroups=r.group; gdGame.aiSorted=true; gdRenderHand(); };
  box.appendChild(sb);
  list.forEach(a=>{ const b=document.createElement('button'); b.className='action'+(a.cls?' '+a.cls:''); b.textContent=a.label; b.onclick=a.cb; box.appendChild(b); });
}
function gdCurrentOwner(){ return gdGame.currentPlay? gdGame.currentPlay.idx : -1; }
function gdRoundEnded(){
  const o=gdGame.outOrder;
  return (o.includes(0)&&o.includes(2)) || (o.includes(1)&&o.includes(3));
}
function gdForceHumanAction(){
  const p=gdGame.players[0]; if(!p || p.hand.length===0) return;
  gdToast('倒计时结束，自动出牌');
  if(gdCurrentOwner()===0 || gdCurrentOwner()===-1){
    let lead=null; try{ lead=gdChooseLead(p.hand); }catch(e){ lead=null; }
    if(lead && lead.length) gdPlayCards(0, lead); else gdDoPass(0);
  } else gdDoPass(0);
}
function gdDoTurn(){
  try{
    gdRenderSeatActive();
    const idx=gdGame.turn;
    if(gdCurrentOwner()===idx){
      gdGame.currentPlay=null; gdGame.lastPlayBy=[null,null,null,null]; gdGame.players.forEach(p=>p.lastPass=false); gdRenderPlay();
    }
    let idx2=idx, g=0;
    while(gdGame.players[idx2].hand.length===0){ idx2=(idx2+1)%4; if(++g>4){ gdCheckRoundEnd(); return; } }
    gdGame.turn=idx2; gdRenderSeatActive();
    startTimer('gClock',4,()=>{ if(gdGame.turn===0) gdForceHumanAction(); });
    if(idx2===0) gdHumanTurn(); else gdAiTurn(idx2);
  }catch(e){ console.error(e); gdGame.turn=(gdGame.turn+1)%4; setTimeout(gdDoTurn,400); }
}
function gdHumanTurn(){
  gdRenderHand();
  const mustLead = gdCurrentOwner()===-1 || gdCurrentOwner()===0;
  const actions=[];
  if(!mustLead) actions.push({ label:'不出', cls:'pass', cb:()=>gdDoPass(0) });
  actions.push({ label:'提示', cls:'alt', cb:()=>gdHintPlay(0) });
  actions.push({ label:'出牌', cb:()=>gdDoPlayHuman() });
  gdRenderActions(actions);
  gdTurnHint('轮到你了'+(mustLead?'，请出牌':'，请选择'));
}
function gdDoPlayHuman(){
  const cards=gdSelectedCards();
  const cl=gdClassify(cards); const cur=gdGame.currentPlay?gdGame.currentPlay.combo:null;
  if(!cards.length){ gdToast('请先选择要出的牌'); return; }
  if(!gdCanBeat(cl,cur)){ gdToast('管不上，出牌不合法'); return; }
  gdPlayCards(0, cards); gdRenderHand();
}
function gdHintPlay(idx){
  const p=gdGame.players[idx]; const cur=gdGame.currentPlay?gdGame.currentPlay.combo:null;
  let play=null;
  try{ play = (cur && gdCurrentOwner()!==idx) ? gdChooseFollow(p.hand,cur,gdCurrentOwner(),idx) : gdChooseLead(p.hand); }
  catch(e){ play=null; }
  if(!play){ gdToast('要不起，只能不出'); return; }
  const uids=new Set(play.map(c=>c.uid));
  document.querySelectorAll('#gHand .card.selected').forEach(el=>el.classList.remove('selected'));
  document.querySelectorAll('#gHand .card').forEach(el=>{ if(uids.has(+el.dataset.uid)) el.classList.add('selected'); });
  gdToast('已为你选好这一手');
}
function gdAiTurn(idx){
  const p=gdGame.players[idx];
  gdRenderActions([]);
  gdTurnHint(gdGame.players[idx].name+' 思考中…');
  setTimeout(()=>{
    if(p.hand.length===0) return;
    const cur=gdGame.currentPlay?gdGame.currentPlay.combo:null; let play=null;
    try{ play = (cur && gdCurrentOwner()!==idx) ? gdChooseFollow(p.hand,cur,gdCurrentOwner(),idx) : gdChooseLead(p.hand); }
    catch(e){ play=null; }
    if(play && play.length) gdPlayCards(idx, play); else gdDoPass(idx);
  }, 900);
}
function gdDoPass(idx){
  gdGame.players[idx].lastPass=true; gdGame.lastPlayBy[idx]=null;
  gdTurnHint(gdGame.players[idx].name+'：不出');
  gdGame.turn=(idx+1)%4; setTimeout(gdDoTurn, 800);
}
function gdPlayCards(idx, cards){
  if(!cards || !cards.length) return;
  const p=gdGame.players[idx]; const cl=gdClassify(cards);
  const remove=new Set(cards.map(c=>c.uid));
  p.hand=p.hand.filter(c=>!remove.has(c.uid));
  gdGame.played=gdGame.played.concat(cards);
  p.lastPass=false;
  gdGame.currentPlay={idx, combo:cl}; gdGame.lastPlayBy[idx]=cards;
  const label = cl.type==='rocket' ? '天王炸' : (gdComboName(cl)+' '+cards.map(gdCardName).join(' '));
  gdTurnHint(gdGame.players[idx].name+' 出了 '+label);
  gdRenderPlay(); gdRenderCounts();
  if(p.hand.length===0){
    gdGame.outOrder.push(idx);
    gdGame.currentPlay=null; gdGame.lastPlayBy=[null,null,null,null]; gdGame.players.forEach(q=>q.lastPass=false);
    gdRenderPlay();
    if(gdRoundEnded()){ gdEndRound(); return; }
    if(idx===0){ gdToast('你已出完牌，拿下头游！'); gdTurnHint('你已出完牌（头游）！等待同队或对方另一人出完结算'); }
    gdGame.turn=(idx+1)%4; setTimeout(gdDoTurn, 800);
    return;
  }
  gdGame.turn=(idx+1)%4; setTimeout(gdDoTurn, 800);
}
function gdCheckRoundEnd(){ if(gdRoundEnded()) gdEndRound(); }
function gdChooseLead(hand){
  const go=gdClassify(hand); if(go) return hand.slice();
  const all=gdCombos(hand);
  const normal=all.filter(c=>c.combo.type!=='bomb'&&c.combo.type!=='rocket'&&c.combo.type!=='straightflush');
  const pool=normal.length?normal:all;
  const isRun=t=>t==='straight'||t==='straightpair'||t==='plane';
  const prio=c=>{ if(!isRun(c.type)) return 2; if(c.mainV<=12||c.size>=8) return 0; return 1; };
  pool.sort((a,b)=>prio(a.combo)-prio(b.combo)||a.combo.mainV-b.combo.mainV||b.cards.length-a.cards.length);
  if(!pool.length){ const c=[...hand].sort((a,b)=>gdEff(a.v)-gdEff(b.v))[0]; return c?[c]:[]; }
  return pool[0].cards;
}
function gdChooseFollow(hand, cur, owner, me){
  const myTeam=gdGame.players[me].team, ownTeam=gdGame.players[owner].team;
  const all=gdCombos(hand);
  const same=all.filter(c=>c.combo.type===cur.type && gdCanBeat(c.combo,cur)).sort((a,b)=>a.combo.mainV-b.combo.mainV||a.cards.length-b.cards.length);
  const myCount=gdGame.players[me].hand.length, ownCount=gdGame.players[owner].hand.length;
  const opponent = ownTeam!==myTeam;
  // 队友手牌数（同队另一人）
  let mateIdx=-1; for(let i=0;i<4;i++){ if(i!==me && gdGame.players[i].team===myTeam){ mateIdx=i; break; } }
  const mateClose = mateIdx>=0 && gdGame.players[mateIdx].hand.length<=2;
  // 对方任一快赢 → 全力拦截，不给对方走牌节奏
  const oppClose = gdGame.players.some(p=> p.team!==myTeam && p.hand.length<=2);
  if(!opponent){
    // 队友出牌：队友快赢(≤2张)不压让队友走；否则打单/小牌时用最小的牌过牌接应
    if(ownCount<=2) return null;
    if(same.length){ const c=same[0]; if(c.combo.mainV<=13) return c.cards; return null; }
    return null;
  }
  if(oppClose){
    if(same.length) return same[0].cards;
    const bombs=all.filter(c=>c.combo.type==='bomb').sort((a,b)=>(a.combo.count||4)-(b.combo.count||4)||a.combo.mainV-b.combo.mainV);
    if(bombs.length) return bombs[0].cards;
    const rocket=all.find(c=>c.combo.type==='rocket'); if(rocket) return rocket.cards;
    return null;
  }
  if(same.length){
    const c=same[0];
    // 队友快赢：用最小的牌接管，帮队友控住节奏
    if(mateClose && c.combo.mainV<15) return c.cards;
    if(c.combo.mainV>=15 && myCount>3) return null;
    return c.cards;
  }
  if(cur.type!=='bomb'&&cur.type!=='rocket'){
    const bombs=all.filter(c=>c.combo.type==='bomb').sort((a,b)=>(a.combo.count||4)-(b.combo.count||4)||a.combo.mainV-b.combo.mainV);
    if(bombs.length && myCount<=5) return bombs[0].cards;
    const rocket=all.find(c=>c.combo.type==='rocket'); if(rocket&&myCount<=3) return rocket.cards;
  }
  return null;
}
function gdPickTribute(pIdx){
  const lv=gdLevelV();
  const hand=gdGame.players[pIdx].hand;
  const cand=hand.filter(c=>!(c.s==='h'&&c.v===lv));
  if(!cand.length) return hand[0]||null;
  cand.sort((a,b)=>gdEff(b.v)-gdEff(a.v));
  return cand[0];
}
function gdPickReturn(pIdx){
  const hand=gdGame.players[pIdx].hand;
  const cand=hand.filter(c=>c.v<=10);
  const pool = cand.length? cand : hand;
  pool.sort((a,b)=>gdEff(a.v)-gdEff(b.v));
  return pool[0]||null;
}
function gdTributePhase(){
  const ord=gdGame.lastOutOrder;
  if(!ord || ord.length<4){ gdStartPlay(); return; }
  const P=gdGame.players;
  const first=ord[0], second=ord[1], third=ord[2], fourth=ord[3];
  const doubleDown = P[first].team===P[second].team;
  const queue=[];
  if(doubleDown){
    queue.push({from:fourth, to:first});
    queue.push({from:third, to:second});
  } else {
    queue.push({from:fourth, to:first});
  }
  let bigJokers=0;
  const fromSet=new Set(queue.map(q=>q.from));
  fromSet.forEach(i=>{ P[i].hand.forEach(c=>{ if(c.v===17) bigJokers++; }); });
  gdGame.firstPlayer=first;
  if(bigJokers>=2){
    gdTurnHint('进贡方持有双大王 · 抗贡！由头游先出');
    gdGame.tributeQueue=[]; gdGame.tributeIdx=0;
    setTimeout(gdStartPlay,1200);
    return;
  }
  gdGame.tributeQueue=queue; gdGame.tributeIdx=0;
  gdTurnHint('进贡阶段开始 · 末游向头游进贡最大牌');
  gdRenderActions([]);
  setTimeout(gdTributeNext, 600);
}
function gdTributeNext(){
  if(gdGame.tributeIdx>=gdGame.tributeQueue.length){
    gdRenderActions([]);
    setTimeout(gdStartPlay, 600);
    return;
  }
  const t=gdGame.tributeQueue[gdGame.tributeIdx];
  const toName=gdGame.players[t.to].name;
  if(t.from===0){
    gdTurnHint('你需向 '+toName+' 进贡一张最大的牌（红桃级牌除外）');
    gdRenderHand();
    const rec=gdPickTribute(0);
    document.querySelectorAll('#gHand .card.selected').forEach(el=>el.classList.remove('selected'));
    if(rec){ const el=[...document.querySelectorAll('#gHand .card')].find(x=>+x.dataset.uid===rec.uid); if(el) el.classList.add('selected'); }
    gdRenderActions([{label:'进贡', cb:()=>gdDoTribute(t,gdSelectedCards())}]);
    if(gdGame.fallTimer) clearTimeout(gdGame.fallTimer);
    gdGame.fallTimer=setTimeout(()=>{ if(rec) gdDoTribute(t,[rec]); },90000);
  } else {
    gdTurnHint(gdGame.players[t.from].name+' 进贡中…');
    gdRenderActions([]);
    setTimeout(()=>{ const rec=gdPickTribute(t.from); if(rec) gdDoTribute(t,[rec]); else { gdGame.tributeIdx++; gdTributeNext(); } }, 800);
  }
}
function gdDoTribute(t, cards){
  if(gdGame.fallTimer){ clearTimeout(gdGame.fallTimer); gdGame.fallTimer=null; }
  if(!cards||cards.length!==1){ gdToast('请选 1 张牌进贡'); return; }
  const card=cards[0];
  const lv=gdLevelV();

/* =========================================================
   升级
   ========================================================= */
const UP_SUITS=['s','h','c','d'];
const UP_LVL={'3':3,'4':4,'5':5,'6':6,'7':7,'8':8,'9':9,'10':10,'11':11,'12':12,'13':13,'14':14,'A':14,'2':15};
const upGame={
  players:[ {name:'你',hand:[],team:0}, {name:'小财',hand:[],team:1}, {name:'老王',hand:[],team:0}, {name:'小富',hand:[],team:1} ],
  level:0, trump:'s', dealer:0, dealerTeam:0,
  teamsLevel:[0,0], scores:[0,0], bottom:[], lastDealer:-1, lastHold:true,
  turn:-1, leadIdx:-1, trick:[], trickTop:null, trickTopBy:-1,
  phase:'idle', roundNo:0, fallTimer:null
};
function upLevelV(){ return UP_LVL[LEVELS[upGame.level]]; }
function upIsMain(c){ const lv=upLevelV(); return c.v>=16 || c.v===lv || c.s===upGame.trump; }
function upVal(c){ const lv=upLevelV(); if(c.v===17) return 100; if(c.v===16) return 90; if(c.v===lv) return 80; return c.v; }
function upSuit(c){ return upIsMain(c)? 'M' : c.s; }
function upPoints(c){ return c.v===5?5 : (c.v===10||c.v===13?10:0); }
function upTractorVal(c){ if(c.v===17) return 17; if(c.v===16) return 16; if(c.v===upLevelV()) return 15; return c.v; }
function consecOrSame(arr){ arr=arr.slice().sort((a,b)=>a-b); for(let i=1;i<arr.length;i++){ if(arr[i]-arr[i-1]>1) return false; } return true; }
function upClassify(cards){
  cards=(cards||[]).filter(c=>c&&typeof c.v==='number');
  const n=cards.length; if(!n) return null;
  const su=upSuit(cards[0]);
  const allSameSuit=cards.every(c=>upSuit(c)===su);
  const vals=cards.map(c=>upVal(c));
  const max=Math.max(...vals);
  if(n===1) return {kind:'single',cnt:1,suit:su,vals,max,allSameSuit:true,shape:[1]};
  const g={}; cards.forEach(c=>{ const k=c.s+'_'+c.v; g[k]=(g[k]||0)+1; });
  const groups=Object.values(g);
  const allPairs=groups.every(x=>x===2);
  if(n===2 && allPairs) return {kind:'pair',cnt:2,suit:su,vals,max,allSameSuit:true,shape:[2]};
  if(allPairs && n>=4){
    const rep={}; cards.forEach(c=>{ const k=c.s+'_'+c.v; rep[k]=c; });
    const pvs=Object.keys(rep).map(k=>upTractorVal(rep[k])).sort((a,b)=>a-b);
    const allMain=cards.every(upIsMain);
    if((allMain ? consecOrSame(pvs) : (allSameSuit && consecutive(pvs)))) return {kind:'tractor',cnt:n,suit:su,vals,max,len:pvs.length,allSameSuit:allSameSuit,shape:Array(pvs.length).fill(2)};
  }
  return {kind:'run',cnt:n,suit:su,vals,max,allSameSuit,shape:groups.slice().sort((a,b)=>b-a)};
}
function upCanBeat(nw,cur){
  if(!cur) return true;
  if(nw.cnt!==cur.cnt) return false;
  if(cur.suit!=='M' && nw.suit==='M') return true;
  if(cur.suit==='M' && nw.suit!=='M') return false;
  if(cur.suit!==nw.suit) return false;
  if(cur.kind==='pair' && nw.kind!=='pair') return false;
  if(cur.kind==='tractor' && (nw.kind!=='tractor'||nw.len!==cur.len)) return false;
  if(cur.kind==='single' && nw.kind!=='single') return false;
  if(cur.kind==='run' && nw.kind!=='run') return false;
  return nw.max>cur.max;
}
function upGen(pool,cnt){
  const out=[]; const seen=new Set();
  const push=(arr)=>{ if(arr.length!==cnt) return; const cl=upClassify(arr); if(!cl) return; const key=arr.map(c=>c.uid).sort((a,b)=>a-b).join(','); if(seen.has(key)) return; seen.add(key); out.push(arr); };
  if(cnt===1){ pool.forEach(c=>push([c])); return out; }
  const g={}; pool.forEach(c=>{ const k=upSuit(c)+'_'+upVal(c); (g[k]=g[k]||[]).push(c); });
  const entries=Object.entries(g);
  if(cnt===2){ entries.forEach(([k,arr])=>{ if(arr.length>=2) push([arr[0],arr[1]]); }); }
  if(cnt>=4 && cnt%2===0){
    const bySuit={};
    entries.forEach(([k,arr])=>{ if(arr.length>=2){ const s2=k.split('_')[0],v=+k.split('_')[1]; (bySuit[s2]=bySuit[s2]||[]).push({v,cards:[arr[0],arr[1]]}); } });
    Object.values(bySuit).forEach(lst=>{
      lst.sort((a,b)=>a.v-b.v);
      for(let i=0;i<lst.length;i++){
        const win=[lst[i]];
        for(let j=i+1;j<lst.length;j++){ if(lst[j].v===win[win.length-1].v+1) win.push(lst[j]); else break; }
        for(let L=2;L<=win.length;L++){
          const seq=win.slice(0,L); const cards=seq.reduce((a,e)=>a.concat(e.cards),[]);
          if(cards.length===cnt) push(cards);
        }
      }
    });
  }
  const sorted=[...pool].sort((a,b)=>upVal(b)-upVal(a));
  if(cnt>=2 && sorted.length>=cnt){ push(sorted.slice(0,cnt)); push(sorted.slice(sorted.length-cnt)); }
  return out;
}
function upFollowCandidates(hand,cur){
  const cnt=cur.cnt;
  const pool = cur.suit!=='M' ? hand.filter(c=>c.s===cur.suit && !upIsMain(c)) : hand.filter(upIsMain);
  const shaped=upGenShape(pool,cnt,cur.shape);
  if(shaped.length) return shaped;
  if(pool.length>=cnt) return upGen(pool,cnt);
  const any=upGen(hand,cnt);
  if(!any.length && hand.length>=cnt){ const s=[...hand].sort((a,b)=>upVal(b)-upVal(a)).slice(0,cnt); any.push(s); }
  return any;
}
function upShapeKey(cl){ return (cl&&cl.shape)?cl.shape.join(','):''; }
function upCanMake(arr,need){
  const a=arr.slice();
  for(let i=0;i<need.length;i++){ let idx=-1; for(let j=0;j<a.length;j++){ if(a[j]>=need[i]){idx=j;break;} } if(idx<0) return false; a[idx]-=need[i]; }
  return true;
}
function upHasShape(pool,cur){
  if(cur.cnt===1) return pool.length>=1;
  const g={}; pool.forEach(c=>{ const k=upSuit(c)+'_'+upVal(c); g[k]=(g[k]||0)+1; });
  return upCanMake(Object.values(g).sort((a,b)=>b-a), cur.shape.slice().sort((a,b)=>b-a));
}
function upGenShape(pool,cnt,shape){
  if(!shape) return upGen(pool,cnt);
  if(cnt===1) return pool.map(c=>[c]);
  if(shape.length===1&&shape[0]===2){
    const out=[]; const g={}; pool.forEach(c=>{ const k=upSuit(c)+'_'+upVal(c); (g[k]=g[k]||[]).push(c); });
    for(const k in g){ if(g[k].length>=2) out.push(g[k].slice(0,2)); }
    return out;
  }
  const g={}; pool.forEach(c=>{ const k=upSuit(c)+'_'+upVal(c); (g[k]=g[k]||[]).push(c); });
  const groups=Object.values(g).sort((a,b)=>b.length-a.length);
  const need=shape.slice().sort((a,b)=>b-a);
  const out=[]; const seen=new Set();
  (function rec(nd,grps,acc){
    if(nd.length===0){ if(acc.length===cnt){ const key=acc.map(c=>c.uid).sort((a,b)=>a-b).join(','); if(!seen.has(key)){seen.add(key);out.push(acc.slice());} } return; }
    const nn=nd[0];
    for(let i=0;i<grps.length;i++){ const gr=grps[i]; if(gr.length>=nn){ rec(nd.slice(1), grps.slice(0,i).concat(grps.slice(i+1)), acc.concat(gr.slice(0,nn))); } }
  })(need,groups,[]);
  return out;
}
function upLeadCandidates(hand){
  const out=[]; const suits=['M','s','h','c','d'];
  suits.forEach(su=>{ const pool=hand.filter(c=>upSuit(c)===su); [1,2,4,6].forEach(cnt=>{ if(pool.length>=cnt) upGen(pool,cnt).forEach(c=>out.push(c)); }); });
  if(!out.length && hand.length) out.push([hand[0]]);
  return out;
}
function upChooseLead(hand){
  const all=upLeadCandidates(hand).filter(c=>upClassify(c).kind!=='run');
  // 自己快赢（≤3张）：优先把牌尽量一次打出去
  if(hand.length<=3){
    const whole=upLeadCandidates(hand);
    if(whole.length){ whole.sort((a,b)=>(b.length-a.length)||(upClassify(b).max-upClassify(a).max)); return whole[0]; }
  }
  const good=all.filter(c=>{ const cl=upClassify(c); return cl.cnt>1 && cl.suit!=='M'; });
  if(good.length){ good.sort((a,b)=>upClassify(a).max-upClassify(b).max); return good[0]; }
  const singles=hand.filter(c=>!upIsMain(c)).sort((a,b)=>upVal(a)-upVal(b));
  if(singles.length) return [singles[0]];
  const any=hand.slice().sort((a,b)=>upVal(a)-upVal(b));
  return any.length?[any[0]]:null;
}
function upLeadCl(){ return upGame.trick.length? upGame.trick[0].combo : null; }
function upChooseFollow(hand,lead,cur,me){
  const cands=upFollowCandidates(hand,lead);
  const beats=cands.filter(c=>upCanBeat(upClassify(c),cur));
  const myTeam=upGame.players[me].team;
  let mateIdx=-1; for(let i=0;i<4;i++){ if(i!==me&&upGame.players[i].team===myTeam){ mateIdx=i; break; } }
  const mateClose = mateIdx>=0 && upGame.players[mateIdx].hand.length<=2;
  const oppClose = upGame.players.some(p=> p.team!==myTeam && p.hand.length<=2);
  const leaderOpp = upGame.trickTopBy>=0 && upGame.players[upGame.trickTopBy].team!==myTeam;
  // 队友领牌：垫最小牌不抢墩，让队友走（队友快赢更应如此）
  if(!leaderOpp){
    if(cands.length){ cands.sort((a,b)=>upClassify(a).max-upClassify(b).max); return cands[0]; }
    const low=[...hand].sort((a,b)=>upVal(a)-upVal(b));
    return low.length?[low[0]]:null;
  }
  // 对手领牌：对方快赢时坚决压住，否则垫小
  if(beats.length){
    beats.sort((a,b)=>upClassify(a).max-upClassify(b).max);
    return beats[0];
  }
  if(cands.length){ cands.sort((a,b)=>upClassify(a).max-upClassify(b).max); return cands[0]; }
  const low=[...hand].sort((a,b)=>upVal(a)-upVal(b));
  return low.length?[low[0]]:null;
}
function upLegalFollow(me,cards,cur){
  if(!cur) return true;
  const hand=upGame.players[me].hand;
  const pool = cur.suit!=='M' ? hand.filter(c=>c.s===cur.suit && !upIsMain(c)) : hand.filter(upIsMain);
  if(pool.length===0) return true;
  if(!cards.every(c=>pool.some(x=>x.uid===c.uid))) return false;
  if(upHasShape(pool,cur)) return upShapeKey(upClassify(cards))===upShapeKey(cur);
  return true;
}
