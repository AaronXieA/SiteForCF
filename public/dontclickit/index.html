<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>不要点击这个按钮 · XRST.Uk</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="dc-body">

  <header class="nav">
    <div class="nav-inner">
      <a class="logo" href="/">XRST<span class="logo-dot">.Uk</span></a>
      <nav class="nav-links">
        <a href="/#about">关于</a>
        <a href="/#works">好玩的</a>
        <a href="/#rewards">签到</a>
        <a href="/#contact">联系</a>
      </nav>
      <div class="nav-auth" id="navAuth"></div>
    </div>
  </header>

  <main class="dc-main">
    <p class="dc-eyebrow">警告 · 你不应该在这里</p>
    <h1 class="dc-title">我警告过你的</h1>
    <button class="dc-button" id="dontClickBtn">不要点击这个按钮</button>
    <p class="dc-hint" id="dcHint">真的，手拿开。</p>
    <div class="dc-foot">
      <a class="dc-back" href="/">← 回到主页</a>
      <button class="dc-reset" id="resetBtn" type="button">重置计数</button>
      <button class="pcl-btn" id="pclBtn" type="button">千万别点</button>
    </div>
  </main>

  <!-- 重置确认弹窗 -->
  <div class="confirm-mask" id="resetConfirm" hidden>
    <div class="confirm-modal" role="dialog" aria-modal="true">
      <h2 class="confirm-title">确定要重置吗？</h2>
      <p class="confirm-text">按下次数和所有彩蛋记录都会清零，无法恢复。</p>
      <div class="confirm-btns">
        <button class="cf-btn" id="resetCancel" type="button">取消</button>
        <button class="cf-btn cf-btn-danger" id="resetOk" type="button">确定重置</button>
      </div>
    </div>
  </div>

  <!-- 114 次：红色质问弹窗（三个按钮都是“知道”，点哪个都能关） -->
  <div class="milestone-mask" id="milestone114" hidden>
    <div class="milestone-modal milestone-red" role="dialog" aria-modal="true">
      <h2 class="milestone-title">你知道你在做什么吗？？？</h2>
      <div class="milestone-btns">
        <button class="ms-btn" type="button" data-close114>知道</button>
        <button class="ms-btn" type="button" data-close114>知道</button>
        <button class="ms-btn" type="button" data-close114>知道</button>
      </div>
    </div>
  </div>

  <!-- 1000 次：通关弹窗 -->
  <div class="milestone-mask" id="milestone1000" hidden>
    <div class="milestone-modal milestone-win" role="dialog" aria-modal="true">
      <h2 class="milestone-title milestone-title-dark">……好吧，你赢了</h2>
      <p class="milestone-sub">一千次。是我输了。</p>
      <button class="ms-btn ms-btn-solid" type="button" data-close1000>承让承让</button>
    </div>
  </div>

  <!-- PCL 风格：最后警告弹窗 -->
  <div class="pcl-mask" id="pclWarn" hidden>
    <div class="pcl-modal" role="dialog" aria-modal="true">
      <div class="pcl-modal-body">
        <h2 class="pcl-title">最后的警告</h2>
        <p class="pcl-text">
          本网站不会受理由于点击此按钮触发的任何 bug。<br />
          这是最后的警告，确定继续？
        </p>
        <div class="pcl-btns">
          <button class="pcl-btn pcl-confirm" type="button" data-pclgo>确定</button>
          <button class="pcl-btn pcl-confirm" type="button" data-pclgo>确定</button>
          <button class="pcl-btn pcl-confirm" type="button" data-pclgo>确定</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 登录 / 注册弹窗 -->
  <div class="modal-mask" id="authModal" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <button class="modal-close" id="authClose" aria-label="关闭">×</button>
      <div class="modal-tabs">
        <button class="tab active" data-tab="login">登录</button>
        <button class="tab" data-tab="register">注册</button>
      </div>

      <form id="loginForm" class="modal-form" autocomplete="on">
        <label>用户名 / XRSTUID
            <input type="text" name="username" required minlength="2" maxlength="20" placeholder="用户名或 XRSTUID" />
        </label>
        <label>密码
          <input type="password" name="password" required minlength="6" placeholder="至少 6 位" />
        </label>
        <p class="form-msg" data-msg></p>
        <button type="submit" class="btn btn-solid btn-block">登录</button>
      </form>

      <form id="registerForm" class="modal-form" hidden autocomplete="off">
        <label>用户名
          <input type="text" name="username" required minlength="2" maxlength="20" placeholder="2-20 个字符" />
        </label>
        <label>密码
          <input type="password" name="password" required minlength="6" placeholder="至少 6 位" />
        </label>
        <label>确认密码
          <input type="password" name="password2" required minlength="6" placeholder="再输一遍" />
        </label>
        <p class="form-msg" data-msg></p>
        <button type="submit" class="btn btn-solid btn-block">创建账号</button>
        <p class="form-note">账号存储在云端，换设备也能登录。</p>
      </form>
    </div>
  </div>

  <div class="toast-box" id="toastBox"></div>

  <script src="../js/auth.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/dontclickit.js"></script>
</body>
</html>
