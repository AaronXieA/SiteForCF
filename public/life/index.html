  <script>
  (function () {
    "use strict";

    /* ---------------- 状态 ---------------- */
    var isMobile = matchMedia("(max-width:640px)").matches;
    var W = 96, H = 72;
    var grid = new Uint8Array(W * H);
    var age = new Uint16Array(W * H); // 每个活细胞已连续存活的代数
    var gen = 0, pop = 0, maxAge = 0;
    var history = [];
    function histMax() {
      // 历史栈：每代 grid(1字节/格)+age(2字节/格)，总量控制在 ~24MB
      return Math.max(30, Math.min(600, Math.floor(24e6 / (W * H * 3))));
    }

    /* 深层设置（localStorage 持久化） */
    var settings = { gradient: false, rule: "B3/S23", wrap: false, grid: "auto", density: 0.26 };
    try {
      var saved = JSON.parse(localStorage.getItem("lg-settings-v1") || "null");
      if (saved) {
        ["gradient", "rule", "wrap", "grid", "density"].forEach(function (k) {
          if (saved[k] !== undefined) settings[k] = saved[k];
        });
      }
    } catch (e) { /* 隐私模式等：忽略 */ }
    function saveSettings() {
      try { localStorage.setItem("lg-settings-v1", JSON.stringify(settings)); } catch (e) {}
    }
    var birth = new Uint8Array(9), surv = new Uint8Array(9);
    function parseRule(str) {
      var m = /^B(\d*)\/S(\d*)$/.exec(str);
      birth = new Uint8Array(9); surv = new Uint8Array(9);
      if (m) {
        m[1].split("").forEach(function (d) { birth[+d] = 1; });
        m[2].split("").forEach(function (d) { surv[+d] = 1; });
      }
    }

    // 环形边界邻居索引（wrap 开启时用）
    var xm = null, xp = null, ym = null, yp = null;
    function buildWrapIndex() {
      xm = new Int32Array(W); xp = new Int32Array(W);
      ym = new Int32Array(H); yp = new Int32Array(H);
      for (var x = 0; x < W; x++) { xm[x] = x > 0 ? x - 1 : W - 1; xp[x] = x + 1 < W ? x + 1 : 0; }
      for (var y = 0; y < H; y++) { ym[y] = y > 0 ? y - 1 : H - 1; yp[y] = y + 1 < H ? y + 1 : 0; }
    }

    var playing = false, fps = 10, acc = 0, lastT = 0;

    /* 相机：世界网格原点(0,0)在视口中的 CSS 像素位置 cam，每格屏幕边长 scale */
    var cam = { x: 0, y: 0, scale: 12 };
    var SCALE_MIN = 2, SCALE_MAX = 80;

    var view = document.getElementById("lgView");
    var canvas = document.getElementById("lgCanvas");
    var ctx = canvas.getContext("2d");
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    var viewW = 0, viewH = 0;

    /* ---------------- DOM ---------------- */
    var statsEl = document.getElementById("lgStats"),
        btnPlay = document.getElementById("btnPlay"),
        btnStep = document.getElementById("btnStep"),
        btnBack = document.getElementById("btnBack"),
        speedEl = document.getElementById("speed"),
        speedVal = document.getElementById("speedVal");

    /* ---------------- 尺寸 / 重置 ---------------- */
    function resetGrid(w, h, randomize) {
      W = w; H = h;
      grid = new Uint8Array(W * H);
      age = new Uint16Array(W * H);
      history = [];
      gen = 0;
      buildWrapIndex();
      if (randomize) {
        for (var i = 0; i < grid.length; i++) {
          if (Math.random() < settings.density) { grid[i] = 1; age[i] = 1; }
        }
      }
      fitView();
      updateStats();
      updateBackBtn();
    }

    function updateStats() {
      var n = 0, oldest = 0;
      for (var i = 0; i < grid.length; i++) {

    /* ---------------- 预设图案库 ---------------- */

    btnBack.addEventListener("touchstart", function (e) { startHold(); e.preventDefault(); }, { passive: false });
    ["mouseup", "mouseleave", "touchend", "touchcancel"].forEach(function (ev) {
      btnBack.addEventListener(ev, stopHold);
    });

    document.getElementById("btnRand").addEventListener("click", function () { resetGrid(W, H, true); });
    document.getElementById("btnClear").addEventListener("click", function () { resetGrid(W, H, false); });

    /* ---------------- 设置弹窗 ---------------- */
    var modal = document.getElementById("lgModal");
    var setGradient = document.getElementById("setGradient"),
        setRule = document.getElementById("setRule"),
        setWrap = document.getElementById("setWrap"),
        setGrid = document.getElementById("setGrid"),
        setDensity = document.getElementById("setDensity"),
        setDensityVal = document.getElementById("setDensityVal"),
        ageLegend = document.getElementById("ageLegend");

    function syncSettingsUI() {
      setGradient.checked = settings.gradient;
      setRule.value = settings.rule;
      setWrap.checked = settings.wrap;
      setGrid.value = settings.grid;
      setDensity.value = Math.round(settings.density * 100);
      setDensityVal.textContent = Math.round(settings.density * 100) + "%";
      ageLegend.hidden = !settings.gradient;
    }
    function openModal() { syncSettingsUI(); modal.hidden = false; }
    function closeModal() { modal.hidden = true; }
    document.getElementById("btnSettings").addEventListener("click", openModal);
    document.getElementById("lgModalClose").addEventListener("click", closeModal);
    modal.addEventListener("click", function (e) { if (e.target === modal) closeModal(); });
    window.addEventListener("keydown", function (e) { if (e.key === "Escape" && !modal.hidden) closeModal(); });

    setGradient.addEventListener("change", function () {
      settings.gradient = setGradient.checked;
      ageLegend.hidden = !settings.gradient;
      saveSettings();
    });
    setRule.addEventListener("change", function () {
      settings.rule = setRule.value;
      parseRule(settings.rule);
      saveSettings();
    });
    setWrap.addEventListener("change", function () {
      settings.wrap = setWrap.checked;
      saveSettings();
    });
    setGrid.addEventListener("change", function () {
      settings.grid = setGrid.value;
      saveSettings();
    });
    setDensity.addEventListener("input", function () {
      settings.density = +setDensity.value / 100;
      setDensityVal.textContent = setDensity.value + "%";
      saveSettings();
    });

    document.getElementById("sizeGroup").addEventListener("click", function (e) {
      var b = e.target.closest(".size-btn");
      if (!b) return;
      document.querySelectorAll(".size-btn").forEach(function (x) { x.classList.remove("on"); });
      b.classList.add("on");
      resetGrid(+b.dataset.w, +b.dataset.h, false);
    });
    document.getElementById("btnCustom").addEventListener("click", function () {
      var w = parseInt(document.getElementById("customW").value, 10);
      var h = parseInt(document.getElementById("customH").value, 10);
      if (!(w >= 10 && w <= 400 && h >= 10 && h <= 400)) {
        speedVal.textContent = "10~400";
        setTimeout(function () { speedVal.textContent = fps + " " + i18nT("life.genPerSec", "代/秒"); }, 1200);
        return;
      }
      document.querySelectorAll(".size-btn").forEach(function (x) { x.classList.remove("on"); });
      resetGrid(w, h, false);
    });

    document.getElementById("btnZoomIn").addEventListener("click", function () {
      zoomAt(viewW / 2, viewH / 2, 1.25);
    });
    document.getElementById("btnZoomOut").addEventListener("click", function () {
      zoomAt(viewW / 2, viewH / 2, 1 / 1.25);
    });
    document.getElementById("btnFit").addEventListener("click", fitView);

    document.getElementById("lgHintClose").addEventListener("click", function () {
      document.getElementById("lgHint").style.display = "none";
    });

    // 空格 = 播放/暂停，方向键 = 步进/倒退
    window.addEventListener("keydown", function (e) {
      if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
      if (e.code === "Space") { btnPlay.click(); e.preventDefault(); }
      else if (e.code === "ArrowRight") { stepForward(); e.preventDefault(); }
      else if (e.code === "ArrowLeft") { stepBack(); e.preventDefault(); }
      else if (e.key === "1") setMode("paint");
      else if (e.key === "2") setMode("pan");
      else if (e.key === "3") setMode("place");
    });

    /* ---------------- 主循环 ---------------- */
    function loop(t) {
      if (playing) {
        if (!lastT) lastT = t;
        acc += (t - lastT) / 1000;
        var interval = 1 / fps, steps = 0;
        while (acc >= interval && steps < 6) { stepForward(); acc -= interval; steps++; }
        if (steps === 6) acc = 0; // 卡顿后不追帧
      }
      lastT = t;
      draw();
      requestAnimationFrame(loop);
    }

    /* ---------------- 启动 ---------------- */
    parseRule(settings.rule);
    resizeCanvas();
    resetGrid(isMobile ? 60 : 96, isMobile ? 44 : 72, true);
    if (isMobile) {
      document.querySelectorAll(".size-btn").forEach(function (b) {
        b.classList.toggle("on", +b.dataset.w === 60 && +b.dataset.h === 44);
      });
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
