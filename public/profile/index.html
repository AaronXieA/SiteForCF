<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人主页 · XRST.Uk</title>
  <meta name="description" content="XRST.Uk 用户个人主页与简介。" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <header class="nav" id="nav">
    <div class="nav-inner">
      <a class="logo" href="/">XRST<span class="logo-dot">.Uk</span></a>
      <nav class="nav-links">
        <a href="/#about">关于</a>
        <a href="/#works">作品</a>
        <a href="/server/">服务器</a>
      </nav>
      <div class="nav-auth" id="navAuth"></div>
    </div>
  </header>

  <main class="pf-main">

    <!-- 未登录且未指定用户 -->
    <section class="pf-card pf-guest" id="guestView" hidden>
      <h1 class="pf-title">登录后查看你的个人主页</h1>
      <p class="pf-sub">写一段简介，保存到云端，还能把主页链接分享给朋友。</p>
      <button class="btn btn-solid" id="guestLoginBtn" type="button">登录 / 注册</button>
    </section>

    <!-- 用户不存在 -->
    <section class="pf-card pf-guest" id="notFoundView" hidden>
      <h1 class="pf-title">没有这个用户</h1>
      <p class="pf-sub">检查一下链接，或者<a href="/profile/">去你自己的主页</a>。</p>
    </section>

    <!-- 主页内容 -->
    <section id="profileView" hidden>
      <div class="pf-card">
        <div class="pf-head">
          <div class="pf-avatar" id="pfAvatar">?</div>
          <div class="pf-head-info">
            <h1 class="pf-name" id="pfName">—</h1>
            <p class="pf-role" id="pfRole">个人主页</p>
          </div>
        </div>

        <!-- 自己的主页：可编辑 -->
        <div id="ownPanel" hidden>
          <label class="pf-label" for="bioInput">个人简介（云端保存，最多 1000 字）</label>
          <textarea
            id="bioInput"
            class="pf-textarea"
            maxlength="1000"
            rows="9"
            placeholder="介绍一下你自己吧……比如喜欢玩什么、在服务器里的 ID、怎么联系你。"
          ></textarea>
          <div class="pf-editor-bar">
            <span class="pf-counter"><b id="bioCount">0</b> / 1000</span>
            <span class="pf-saved" id="bioSaved"></span>
            <button class="btn btn-solid" id="bioSaveBtn" type="button">保存简介</button>
          </div>

          <div class="pf-share">
            <span class="pf-share-label">你的公开主页链接：</span>
            <code class="pf-share-link" id="shareLink">—</code>
            <button class="text-btn" id="copyShareBtn" type="button">复制</button>
          </div>
        </div>

        <!-- 别人的主页：只读 -->
        <div id="otherPanel" hidden>
          <div class="pf-bio" id="otherBio"></div>
          <p class="pf-empty" id="otherEmpty" hidden>这个人还没有写简介。</p>
          <a class="btn btn-ghost pf-back-btn" href="/profile/">← 回到我的主页</a>
        </div>
      </div>
    </section>

  </main>

  <!-- 登录 / 注册弹窗 -->
  <div class="modal-mask" id="authModal" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <button class="modal-close" id="authClose" aria-label="关闭">×</button>
      <div class="modal-tabs">
        <button class="tab active" data-tab="login">登录</button>
        <button class="tab" data-tab="register">注册</button>
      </div>

      <form id="loginForm" class="modal-form" autocomplete="on">
        <label>用户名
          <input type="text" name="username" required minlength="2" maxlength="20" placeholder="你的用户名" />
        </label>
        <label>密码
          <input type="password" name="password" required minlength="6" placeholder="至少 6 位" />
        </label>
        <p class="form-msg" data-msg></p>
        <button type="submit" class="btn btn-solid btn-block">登录</button>
      </form>

      <form id="registerForm" class="modal-form" hidden autocomplete="off">
        <label>用户名
          <input type="text" name="username" required minlength="2" maxlength="20" placeholder="2-20 个字符" />
        </label>
        <label>密码
          <input type="password" name="password" required minlength="6" placeholder="至少 6 位" />
        </label>
        <label>确认密码
          <input type="password" name="password2" required minlength="6" placeholder="再输一遍" />
        </label>
        <p class="form-msg" data-msg></p>
        <button type="submit" class="btn btn-solid btn-block">创建账号</button>
        <p class="form-note">账号存储在云端，换设备也能登录。</p>
      </form>
    </div>
  </div>

  <div class="toast-box" id="toastBox"></div>

  <script src="../js/auth.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/profile.js"></script>
</body>
</html>
